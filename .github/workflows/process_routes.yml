name: Process Walking Routes

on:
  push:
    paths:
      - 'routes.geojson'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip-ci')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install geopandas shapely requests

      - name: Run Spatial Enrichment Script
        run: |
          python process_routes.py

      - name: Commit and push enriched GeoJSON
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add routes.geojson
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Enrich spatial admin metadata [skip-ci]" && git push)
