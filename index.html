<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>ROUTE S - 아카이브 지도 & 리스트</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #191a1a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    #app-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    #loading-badge {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      background: rgba(18, 20, 26, 0.92);
      color: #00ffff;
      border: 1px solid rgba(0, 255, 255, 0.4);
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .view-pane {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: none;
    }
    .view-pane.active {
      display: flex;
      flex-direction: column;
    }

    #map-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }
    #map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0; left: 0;
    }

    .maplibregl-canvas-container {
      background-color: #1a1a1a;
    }

    /* 통합 상단 필터바 */
    .filter-container {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 105;
      background: rgba(18, 20, 26, 0.95);
      padding: 6px 10px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.15);
      display: flex;
      gap: 5px;
      align-items: center;
      backdrop-filter: blur(8px);
      flex-wrap: nowrap;
      white-space: nowrap;
    }

    #logo-icon {
      height: 22px;
      width: auto;
      object-fit: contain;
      cursor: pointer;
      border-radius: 4px;
      margin-right: 1px;
      flex-shrink: 0;
    }

    .filter-select {
      background: #252836;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      padding: 5px 6px;
      font-size: 11.5px;
      outline: none;
      cursor: pointer;
      text-overflow: ellipsis;
      overflow: hidden;
      flex-shrink: 1;
    }
    .filter-select:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .search-input {
      background: #252836;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 11.5px;
      outline: none;
      width: 140px;
      flex-shrink: 1;
    }
    .search-input::placeholder { color: #888; }
    .search-input:focus { border-color: #00ffff; }

    .mode-switch {
      background: #252836;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      padding: 2px;
      display: flex;
      gap: 2px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .mode-btn {
      background: transparent;
      border: none;
      color: #aaa;
      padding: 4px 6px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn.active {
      background: #00ffff;
      color: #000;
    }

    .action-btn {
      background: #252836;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 11.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .action-btn:hover { background: #2f3346; }

    .dropdown-multiselect {
      position: relative;
      display: inline-block;
      flex-shrink: 0;
    }
    .dropdown-btn {
      background: #252836;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 11.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .dropdown-btn:hover { background: #2f3346; }
    .dropdown-content {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 4px;
      background: #1e222d;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.7);
      padding: 8px 10px;
      z-index: 120;
      min-width: 135px;
      max-height: 240px;
      overflow-y: auto;
      white-space: nowrap;
    }
    .dropdown-content.show { display: block; }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #ddd;
      font-size: 11.5px;
      padding: 3px 0;
      cursor: pointer;
    }
    .checkbox-label:hover { color: #00ffff; }
    .checkbox-label input { accent-color: #00ffff; cursor: pointer; }

    /* 플레이어 패널 */
    #player-panel {
      position: absolute;
      top: 65px;
      right: 15px;
      width: 380px;
      max-width: calc(100vw - 30px);
      height: auto;
      background: rgba(18, 20, 26, 0.96);
      color: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.85);
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 100;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.14);
    }
    #player-container {
      width: 100%;
      height: 215px;
      background: #000;
      position: relative;
      flex-shrink: 0;
    }
    #player-container iframe { width: 100%; height: 100%; border: none; display: block; }
    #info-box { padding: 8px 12px; background: rgba(22, 25, 34, 0.98); display: flex; flex-direction: column; gap: 5px; }
    #video-title { font-size: 13.5px; font-weight: bold; color: #00ffff; line-height: 1.3; width: 100%; }

    /* 플레이어 툴바 */
    #player-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      flex-wrap: wrap;
      padding-top: 3px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .tool-chip {
      background: #252836;
      color: #ccc;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 5px;
      padding: 2.5px 6px;
      font-size: 10.5px;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .tool-chip:hover { background: #32364a; color: #fff; border-color: #00ffff; }
    .tool-chip.active { background: rgba(0, 255, 255, 0.18); color: #00ffff; border-color: #00ffff; font-weight: bold; }
    .tool-chip.overlap-switch { background: rgba(255, 230, 0, 0.15); color: #ffe600; border-color: rgba(255, 230, 0, 0.45); display: none; }
    .tool-chip.overlap-switch:hover { background: #ffe600; color: #000; font-weight: bold; }
    #sync-status { font-size: 10.5px; color: #ffe600; font-family: monospace; }

    /* 리스트 모드일 때 레이아웃 */
    body.list-mode #player-panel {
      position: relative;
      top: 65px;
      left: 0;
      right: 0;
      width: 100%;
      max-width: none;
      height: 44vh;
      border-radius: 0;
      border: none;
      border-bottom: 2px solid #00ffff;
      box-shadow: 0 4px 20px rgba(0,0,0,0.9);
      display: flex !important;
    }
    body.list-mode #player-container { flex: 1; height: auto; min-height: 0; }
    body.list-mode #info-box { flex: 0 0 auto; padding: 7px 15px; }
    body.list-mode #video-title { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    body.list-mode #split-btn, body.list-mode #close-btn { display: none; }

    #list-view-container {
      width: 100%;
      height: 100%;
      background: #14161c;
      display: flex;
      flex-direction: column;
      padding-top: calc(44vh + 65px);
    }
    #list-controls-bar {
      max-width: 900px;
      width: calc(100% - 30px);
      margin: 12px auto 5px auto;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    #list-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 10px 15px 15px 15px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }
    .route-item {
      background: rgba(26, 29, 38, 0.85);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 15px;
      transition: background 0.15s, border-color 0.15s;
    }
    .route-item:hover {
      background: rgba(0, 206, 209, 0.15);
      border-color: #00ffff;
    }
    .route-item.active-playing {
      border-color: #ffe600;
      background: rgba(255, 230, 0, 0.1);
    }
    .route-number { font-size: 14px; font-weight: bold; color: #888; min-width: 38px; }
    .route-details { flex: 1; }
    .route-item-title { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 4px; }
    .route-item-meta { font-size: 11.5px; color: #00ffff; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .theme-badge { background: rgba(255,255,255,0.1); color: #ddd; padding: 1px 6px; border-radius: 4px; font-size: 10.5px; }

    .panel-btn {
      position: absolute; top: 8px; background: rgba(0,0,0,0.65);
      color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px;
      width: 28px; height: 28px; cursor: pointer; font-size: 14px;
      display: flex; align-items: center; justify-content: center; z-index: 101;
      transition: background 0.2s;
    }
    .panel-btn:hover { background: rgba(0,206,209,0.8); color: #000; }
    #close-btn { right: 8px; font-size: 16px; }
    #split-btn { right: 42px; font-size: 13px; }

    /* 중복 경로 선택 팝업 스타일 */
    .maplibregl-popup-content {
      background: rgba(18, 20, 28, 0.96) !important;
      color: #fff !important;
      border-radius: 10px !important;
      padding: 10px 12px !important;
      font-size: 12px !important;
      box-shadow: 0 8px 25px rgba(0,0,0,0.8) !important;
      border: 1px solid rgba(0, 255, 255, 0.35) !important;
      max-width: 310px !important;
    }
    .maplibregl-popup-close-button { color: #aaa !important; font-size: 16px !important; right: 6px !important; top: 4px !important; }
    .overlap-popup-title { font-size: 11.5px; font-weight: bold; color: #ffe600; margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.15); }
    .overlap-list { max-height: 190px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .overlap-item {
      padding: 6px 8px; border-radius: 6px; background: rgba(255,255,255,0.06);
      cursor: pointer; transition: all 0.15s; font-size: 11.5px; line-height: 1.3;
    }
    .overlap-item:hover { background: #00ffff; color: #000; font-weight: bold; }

    /* 지도 위 시점/종점/현재위치 커스텀 마커 */
    .route-marker {
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: bold; color: #fff;
      border-radius: 50%; box-shadow: 0 2px 6px rgba(0,0,0,0.7);
      pointer-events: none;
    }
    .marker-start { width: 20px; height: 20px; background: #00c853; border: 2px solid #fff; }
    .marker-end { width: 20px; height: 20px; background: #ff1744; border: 2px solid #fff; }
    .marker-walker {
      width: 16px; height: 16px; background: #ff9100; border: 2.5px solid #fff;
      box-shadow: 0 0 12px #ff9100; transition: transform 0.1s linear;
    }

    @media (max-width: 768px) {
      .filter-container {
        top: 8px; left: 10px; transform: none;
        width: calc(100vw - 20px); max-width: 100%;
        padding: 4px 6px; gap: 3px;
        overflow-x: auto; -webkit-overflow-scrolling: touch;
      }
      .filter-container::-webkit-scrollbar { display: none; }
      #logo-icon { height: 18px; }
      .filter-select, .dropdown-btn, .action-btn, .search-input { padding: 4px 5px; font-size: 10.5px; }
      .search-input { width: 105px; }
      #player-panel { top: 52px; left: 10px; right: 10px; width: calc(100% - 20px); max-width: 100%; }
      body.list-mode #player-panel { top: 52px; left: 0; right: 0; width: 100%; max-width: 100%; height: 32vh; }
      #list-view-container { padding-top: calc(32vh + 52px); }
      #list-controls-bar { width: calc(100% - 20px); margin: 8px auto 4px auto; }
    }

    body.split-mode #app-container { display: flex; flex-direction: column; }
    body.split-mode #player-panel {
      position: relative; top: 0; left: 0; right: 0; width: 100%; max-width: 100%;
      height: 50vh; border-radius: 0; border: none; border-bottom: 2px solid #00ffff;
      box-shadow: 0 4px 20px rgba(0,0,0,0.9); display: flex;
    }
    body.split-mode #player-container { flex: 1; height: auto; min-height: 0; }
    body.split-mode #map-wrapper { flex: none; height: 50vh; width: 100%; }
  </style>
</head>
<body class="map-mode">

<div id="app-container">
  <div id="loading-badge">⏳ 코스 데이터 불러오는 중...</div>

  <!-- 통합 상단 필터바 -->
  <div id="main-filter-container" class="filter-container">
    <img id="logo-icon" src="./logo.png" alt="ROUTE S" title="ROUTE S 채널 바로가기" onclick="window.open('https://www.youtube.com/@루트에스', '_blank')">

    <div class="mode-switch">
      <button id="btn-map-mode" class="mode-btn active" onclick="switchMode('map')">🗺️ MAP</button>
      <button id="btn-list-mode" class="mode-btn" onclick="switchMode('list')">📜 LIST</button>
    </div>

    <select id="country-select" class="filter-select">
      <option value="ALL">1: 국가 전체 (All)</option>
    </select>
    <select id="sido-select" class="filter-select" disabled>
      <option value="ALL">2: 시·도 (State)</option>
    </select>
    <select id="sigungu-select" class="filter-select" disabled>
      <option value="ALL">3: 시·군·구 (City/Dist.)</option>
    </select>

    <!-- 연도별 멀티 드롭다운 -->
    <div class="dropdown-multiselect" id="year-dropdown-container">
      <button class="dropdown-btn" type="button" onclick="toggleDropdown('year-checkboxes')">📅 연도별 ▼</button>
      <div class="dropdown-content" id="year-checkboxes"></div>
    </div>

    <!-- 테마/분위기 멀티 드롭다운 -->
    <div class="dropdown-multiselect" id="theme-dropdown-container">
      <button class="dropdown-btn" type="button" onclick="toggleDropdown('theme-checkboxes')">🎨 테마별 ▼</button>
      <div class="dropdown-content" id="theme-checkboxes"></div>
    </div>
  </div>

  <!-- 플레이어 & 슬림 컨트롤 패널 -->
  <div id="player-panel">
    <button id="split-btn" class="panel-btn" onclick="toggleSplitMode()" title="화면 상하 분할 / 팝업 토글">◫</button>
    <button id="close-btn" class="panel-btn" onclick="closePlayer()" title="닫기">×</button>
    <div id="player-container"><div id="yt-player"></div></div>
    <div id="info-box">
      <div id="video-title">코스 명칭</div>
      <div id="player-toolbar">
        <span id="sync-status">🟢 S ➔ 🏁 E 대기중</span>
        <div style="display:flex; gap:4px; align-items:center;">
          <button id="btn-overlap-switch" class="tool-chip overlap-switch" onclick="reopenOverlapPopup()" title="방금 클릭한 지점을 지나는 다른 중복 코스 목록을 엽니다">📑 겹친 코스</button>
          <button id="btn-click-seek" class="tool-chip active" onclick="toggleClickSeek()" title="켜두면 지도 위 노선을 클릭할 때 영상이 해당 위치 시간으로 이동합니다">📍 클릭이동 ON</button>
          <button class="tool-chip" onclick="copyCurrentRouteLink()" title="이 코스의 딥링크 URL 복사">🔗 링크복사</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 지도 뷰 -->
  <div id="map-pane" class="view-pane active">
    <div id="map-wrapper">
      <div id="map"></div>
    </div>
  </div>

  <!-- 리스트 뷰 -->
  <div id="list-pane" class="view-pane">
    <div id="list-view-container">
      <div id="list-controls-bar">
        <input type="text" id="search-input" class="search-input" placeholder="제목·코드·번호 검색" oninput="renderRouteList()" onkeydown="if(event.key==='Enter') { this.blur(); renderRouteList(); }">
        <button id="sort-order-btn" class="action-btn" onclick="toggleSortOrder()" title="정렬 순서 변경">🔄 과거순</button>
        <span id="list-count-label" style="font-size:11.5px; color:#888; margin-left:auto;"></span>
      </div>
      <div id="list-scroll-area"></div>
    </div>
  </div>
</div>

<script>
  let player = null;
  let playerReady = false;
  let pendingVideoId = null;
  let pendingSeekRatio = null;
  let activeLine = null;
  let activeLineId = null;
  let hoveredLineId = null;
  let rawGeojsonData = null;
  let adminHierarchy = {};
  let availableYears = new Set();
  let selectedYears = new Set();
  let isSplitMode = false;
  let currentMode = 'map';
  let sortAscending = true;
  let isDataInitialized = false;
  let isMapLayerAdded = false;

  // 리스트 가상 스크롤 변수
  let currentListFeatures = [];
  let renderedListCount = 0;
  const LIST_PAGE_SIZE = 60;

  // 시간-위치 동기화 및 중복 구간 상태 변수
  let isClickSeekEnabled = true;
  let currentCleanedCoords = [];
  let currentCleanLineTurf = null;
  let currentLineLengthKm = 0;
  let startMarker = null;
  let endMarker = null;
  let walkerMarker = null;
  let syncTimer = null;
  let activeOverlapPopup = null;
  let lastOverlapInfo = null;

  const THEME_DEFINITIONS = [
    { key: 'day', label: '☀️ 주간 산책' },
    { key: 'night', label: '🌙 야간/저녁' },
    { key: 'rain_snow', label: '☔ 우천/설경' },
    { key: 'alley', label: '🏘️ 골목/주택가' },
    { key: 'urban', label: '🏙️ 도심/번화가' },
    { key: 'park_campus', label: '🌳 공원/캠퍼스' }
  ];
  let selectedThemes = new Set(THEME_DEFINITIONS.map(t => t.key));

  const ytScript = document.createElement('script');
  ytScript.src = "https://www.youtube.com/iframe_api";
  ytScript.async = true;
  document.head.appendChild(ytScript);

  const SEOUL_DISTRICTS = new Set([
    "종로구", "중구", "용산구", "성동구", "광진구", "동대문구", "중랑구", "성북구",
    "강북구", "도봉구", "노원구", "은평구", "서대문구", "마포구", "양천구", "강서구",
    "구로구", "금천구", "영등포구", "동작구", "관악구", "서초구", "강남구", "송파구", "강동구"
  ]);

  const COUNTRY_EN_MAP = {
    "대한민국": "South Korea", "일본": "Japan", "싱가포르": "Singapore",
    "남아프리카공화국": "RSA", "대만": "Taiwan", "미국": "USA",
    "베트남": "Vietnam", "캐나다": "Canada", "홍콩": "Hong Kong",
    "러시아": "Russia", "중국": "China", "말레이시아": "Malaysia", "마카오": "Macau"
  };

  const SIDO_SHORT_MAP = {

  function getFeatureFullText(feature) {
    if (feature._fullText !== undefined) return feature._fullText;
    const props = feature.properties || {};
    let descText = "";
    if (typeof props.description === 'object' && props.description !== null) {
      descText = props.description.value || "";
    } else if (typeof props.description === 'string') {
      descText = props.description;
    }
    feature._fullText = `${props.name || ""} ${props.Name || ""} ${descText} ${props.Description || ""}`;
    return feature._fullText;
  }

  function inferThemesFromFeature(feature) {
    const props = feature.properties || {};
    if (Array.isArray(props.themes) && props.themes.length > 0) {
      return new Set(props.themes);
    }

    const text = getFeatureFullText(feature).toLowerCase();
    const themes = new Set();

    if (/야간|야경|밤|저녁|퇴근|night|evening|오후\s*(6|7|8|9|10|11)시|밤산책/.test(text)) {
      themes.add('night');
    } else {
      themes.add('day');
    }

    if (/우천|비오는|비\s*온|봄비|장마|폭우|빗방울|눈|폭설|설경|소낙눈|rain|snow|wet/.test(text)) {
      themes.add('rain_snow');
    }

    if (/공원|대학교|대학|캠퍼스|숲|산책로|제방길|하천|수목원|식물원|천\b|univ|park|campus|forest/.test(text)) {
      themes.add('park_campus');
    }

    if (/골목|주택|아파트|단지|빌라|마을|재개발|뉴타운|초등|중학교|고등|alley|village|apt|residential/.test(text)) {
      themes.add('alley');
    }

    if (/명동|강남|홍대|성수|신촌|을지로|종로|이태원|압구정|가로수길|로데오|광화문|남대문|동대문|시장|백화점|오피스|역세권|번화가|메인스트리트|downtown|market|street/.test(text)) {
      themes.add('urban');
    }

    if (!themes.has('alley') && !themes.has('urban') && !themes.has('park_campus')) {
      themes.add('urban');
    }

    return themes;
  }

  // O(1) 첫 좌표 추출
  function getFirstCoordFast(coords) {
    let curr = coords;
    while (Array.isArray(curr) && curr.length > 0 && Array.isArray(curr[0])) {
      curr = curr[0];
    }
    return (Array.isArray(curr) && typeof curr[0] === 'number') ? [curr[0], curr[1]] : null;
  }

  // 지연 정제 + 캐싱
  function getCleanedCoordsForFeature(feature) {
    if (!feature) return [];
    if (feature._cleanedCoords) return feature._cleanedCoords;
    const rawCoords = (feature.geometry && feature.geometry.coordinates) ? feature.geometry.coordinates : [];
    feature._cleanedCoords = sanitizeRouteCoordinates(rawCoords);
    return feature._cleanedCoords;
  }

  function sanitizeRouteCoordinates(rawCoords) {
    if (!rawCoords || rawCoords.length === 0) return [];

    let flat = [];
    function flatten(arr) {
      if (!Array.isArray(arr) || arr.length === 0) return;
      if (typeof arr[0] === 'number') {
        flat.push([arr[0], arr[1]]);
      } else {
        arr.forEach(flatten);
      }
    }
    flatten(rawCoords);
    if (flat.length < 2) return flat;

    let cleaned = [flat[0]];
    for (let i = 1; i < flat.length; i++) {
      const prev = cleaned[cleaned.length - 1];
      const curr = flat[i];
      const distKm = turf.distance(turf.point(prev), turf.point(curr), { units: 'kilometers' });
      if (distKm < 0.0015) continue;

      if (distKm > 0.25 && i + 1 < flat.length) {
        const next = flat[i + 1];
        const prevToNextKm = turf.distance(turf.point(prev), turf.point(next), { units: 'kilometers' });
        if (prevToNextKm < distKm * 0.5) continue;
      }
      cleaned.push(curr);
    }

    if (cleaned.length < 2) cleaned = [flat[0], flat[flat.length - 1]];
    return cleaned;
  }

  function calculateClickRatioOnFeature(feature, lngLat) {
    if (!feature || !lngLat || !feature.geometry || !feature.geometry.coordinates) return 0;
    try {
      const cleanCoords = getCleanedCoordsForFeature(feature);
      if (cleanCoords.length < 2) return 0;
      const line = turf.lineString(cleanCoords);
      const totalKm = turf.length(line, { units: 'kilometers' });
      if (totalKm <= 0) return 0;

      const clickedPt = turf.point([lngLat.lng, lngLat.lat]);
      const snapped = turf.nearestPointOnLine(line, clickedPt, { units: 'kilometers' });
      if (snapped && snapped.properties && typeof snapped.properties.location === 'number') {
        const ratio = Math.min(1, Math.max(0, snapped.properties.location / totalKm));
        return ratio < 0.02 ? 0 : ratio;
      }
    } catch (e) {}
    return 0;
  }

  function formatTimeMMSS(seconds) {
    if (!seconds || isNaN(seconds) || seconds < 0) return "00:00";
    const s = Math.floor(seconds);
    const mins = Math.floor(s / 60);
    const secs = s % 60;
    return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
  }

    if (lowerText.includes('singapore') || lowerText.includes('싱가포르') || lowerText.includes('싱가폴')) return "싱가포르";
    if (lowerText.includes('hong kong') || lowerText.includes('홍콩')) return "홍콩";
    if (lowerText.includes('macau') || lowerText.includes('마카오')) return "마카오";
    return null;
  }

  function formatCountryLabel(val) {

  function formatSidoLabel(val) {

  }

  function formatSigunguLabel(val) {
    if (val === "ALL") return "3: 시·군·구 (City/Dist.)";
    let en = DISTRICT_EN_MAP[val];
    if (!en) {
      if (val.endsWith('구')) en = val.replace('구', '-gu');
      else if (val.endsWith('시')) en = val.replace('시', '-si');
      else if (val.endsWith('군')) en = val.replace('군', '-gun');
      else en = val;
    }
    return `${val} (${en})`;
  }

  function extractTimestamp(feature) {
    const text = getFeatureFullText(feature);
    const yearMatch = text.match(/\b(20\d{2})\b/);
    const year = yearMatch ? parseInt(yearMatch[1], 10) : 2020;
    const months = { jan:1, feb:2, mar:3, apr:4, may:5, jun:6, jul:7, aug:8, sep:9, oct:10, nov:11, dec:12, feg:2 };
    let month = 1;
    const mMatch = text.match(/(Jan|Feb|Feg|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)/i);
    if (mMatch) {
      month = months[mMatch[1].toLowerCase()] || 1;
    } else {
      const korMMatch = text.match(/(\d{1,2})월/);
      if (korMMatch) month = parseInt(korMMatch[1], 10);
    }
    return year * 100 + month;
  }

  function extractYear(feature) {
    if (feature._year !== undefined) return feature._year;
    const text = getFeatureFullText(feature);
    const match = text.match(/\b(20\d{2})\b/);
    feature._year = match ? match[1] : null;
    return feature._year;
  }

  function formatLocationTag(props) {
    const country = props.country || "대한민국";
    if (country !== "대한민국") return `[${COUNTRY_EN_MAP[country] || country}]`;

    const sidos = (props.sido || "").split(',').map(s => normalizeSido(s)).filter(Boolean);
    const sigs = (props.sigungu || "").split(',').map(s => s.trim()).filter(Boolean);

    if (sigs.length === 0) {
      return sidos.length > 0 ? `[${sidos.map(sd => SIDO_SHORT_MAP[sd] || sd).join(', ')}]` : "";
    }

    let pairs = [];
    sigs.forEach(sig => {
      if (SEOUL_DISTRICTS.has(sig)) {
        pairs.push(`서울 ${sig}`);
      } else {
        let matchedSido = sidos.find(sd => sd !== "서울특별시") || sidos[0] || "경기도";
        pairs.push(`${SIDO_SHORT_MAP[matchedSido] || matchedSido} ${sig}`);
      }
    });

    return `[${pairs.join(', ')}]`;
  }

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('yt-player', {
      height: '100%',
      width: '100%',
      playerVars: {
        autoplay: 0,
        controls: 1,
        rel: 0,
        playsinline: 1,
        enablejsapi: 1,
        origin: window.location.origin
      },
      events: {
        onReady: function(event) {
          playerReady = true;
          if (pendingVideoId) {
            const videoId = pendingVideoId;
            pendingVideoId = null;
            event.target.loadVideoById(videoId);
          }
          const pc = document.getElementById('player-container');
          if (pc && typeof event.target.setSize === 'function') {
            event.target.setSize(pc.clientWidth, pc.clientHeight);
          }
          startSyncLoop();
        },
        onStateChange: function(event) {
          if ((event.data === YT.PlayerState.PLAYING || event.data === YT.PlayerState.BUFFERING || event.data === YT.PlayerState.CUED) && pendingSeekRatio !== null) {
            const dur = event.target.getDuration();
            if (dur && dur > 0) {
              const targetSec = dur * pendingSeekRatio;
              pendingSeekRatio = null;
              if (targetSec > 1) {
                event.target.seekTo(targetSec, true);
              }
            }
          }
        }
      }
    });
  }

  function loadRouteVideo(videoId, initialSeekRatio = null) {
    if (!videoId) return;
    pendingSeekRatio = (initialSeekRatio !== null && initialSeekRatio > 0) ? initialSeekRatio : null;

    if (!playerReady || !player || typeof player.loadVideoById !== 'function') {
      pendingVideoId = videoId;
      return;
    }
    player.loadVideoById(videoId);
  }

  function startSyncLoop() {
    if (syncTimer) clearInterval(syncTimer);
    syncTimer = setInterval(() => {
      if (!playerReady || !player || !activeLine || !currentCleanLineTurf || currentLineLengthKm <= 0) return;
      if (typeof player.getCurrentTime !== 'function' || typeof player.getDuration !== 'function') return;

      const duration = player.getDuration();
      if (!duration || duration <= 0) return;

      if (pendingSeekRatio !== null) {
        const targetSec = duration * pendingSeekRatio;
        pendingSeekRatio = null;
        if (targetSec > 1 && typeof player.seekTo === 'function') {
          player.seekTo(targetSec, true);
          return;
        }
      }

      const current = player.getCurrentTime();
      const ratio = Math.min(1, Math.max(0, current / duration));
      const targetDistKm = currentLineLengthKm * ratio;

      try {
        const pt = turf.along(currentCleanLineTurf, targetDistKm, { units: 'kilometers' });
        if (pt && pt.geometry && pt.geometry.coordinates) {
          if (!walkerMarker) {
            const el = document.createElement('div');
            el.className = 'route-marker marker-walker';
            walkerMarker = new maplibregl.Marker({ element: el }).setLngLat(pt.geometry.coordinates).addTo(map);
          } else {
            walkerMarker.setLngLat(pt.geometry.coordinates);
          }
          const pct = Math.round(ratio * 100);
          const curTimeStr = formatTimeMMSS(current);
          const totTimeStr = formatTimeMMSS(duration);
          document.getElementById('sync-status').innerText = `🏃 ${curTimeStr} / ${totTimeStr} (${pct}%)`;
        }
      } catch (e) {}
    }, 250);
  }

  function setupRouteMarkers(feature, initialRatio = 0) {
    clearRouteMarkers();
    if (!feature || !feature.geometry || !feature.geometry.coordinates) return;

    currentCleanedCoords = getCleanedCoordsForFeature(feature);
    if (currentCleanedCoords.length < 2) return;

    currentCleanLineTurf = turf.lineString(currentCleanedCoords);
    currentLineLengthKm = turf.length(currentCleanLineTurf, { units: 'kilometers' });

    const startCoord = currentCleanedCoords[0];
    const endCoord = currentCleanedCoords[currentCleanedCoords.length - 1];

    const sEl = document.createElement('div');
    sEl.className = 'route-marker marker-start';
    sEl.innerText = 'S';
    startMarker = new maplibregl.Marker({ element: sEl }).setLngLat(startCoord).addTo(map);

    const eEl = document.createElement('div');
    eEl.className = 'route-marker marker-end';
    eEl.innerText = 'E';
    endMarker = new maplibregl.Marker({ element: eEl }).setLngLat(endCoord).addTo(map);

    let initialWalkerCoord = startCoord;
    if (initialRatio > 0 && currentLineLengthKm > 0) {
      try {
        const pt = turf.along(currentCleanLineTurf, currentLineLengthKm * initialRatio, { units: 'kilometers' });
        if (pt && pt.geometry && pt.geometry.coordinates) {
          initialWalkerCoord = pt.geometry.coordinates;
        }
      } catch (e) {}
    }

    const wEl = document.createElement('div');
    wEl.className = 'route-marker marker-walker';
    walkerMarker = new maplibregl.Marker({ element: wEl }).setLngLat(initialWalkerCoord).addTo(map);

    const totalM = Math.round(currentLineLengthKm * 1000);
    document.getElementById('sync-status').innerText = `🟢S➔🏁E (총 ${totalM}m)`;
  }

  function clearRouteMarkers() {
    if (startMarker) { startMarker.remove(); startMarker = null; }
    if (endMarker) { endMarker.remove(); endMarker = null; }
    if (walkerMarker) { walkerMarker.remove(); walkerMarker = null; }
    currentCleanedCoords = [];
    currentCleanLineTurf = null;
    currentLineLengthKm = 0;
  }

    });
  }

  const map = new maplibregl.Map({
    container: 'map',
    scrollZoom: true, boxZoom: true, dragRotate: true, dragPan: true, maxZoom: 19,
    style: {
      version: 8,
      sources: {
        'osm-tiles': {
          type: 'raster',
          tiles: [
            'https://a.tile.openstreetmap.org/{z}/{x}/{y}.png',
            'https://b.tile.openstreetmap.org/{z}/{x}/{y}.png',
            'https://c.tile.openstreetmap.org/{z}/{x}/{y}.png'
          ],
          tileSize: 256,
          attribution: '&copy; OpenStreetMap contributors'
        }
      },
      layers: [{
        id: 'osm-tiles-layer', type: 'raster', source: 'osm-tiles', minzoom: 0, maxzoom: 19,
        paint: { 'raster-brightness-max': 0.35, 'raster-brightness-min': 0.05, 'raster-contrast': 0.25, 'raster-saturation': -1.0 }
      }]
    },
    center: [126.9780, 37.5665], zoom: 11
  });

  map.addControl(new maplibregl.NavigationControl(), 'bottom-right');

  function extractYouTubeId(value) {
    if (value === null || value === undefined) return null;
    if (typeof value === 'object') {
      const preferredKeys = ['value', 'url', 'href', 'src', 'html', 'text'];
      for (const key of preferredKeys) {
        if (Object.prototype.hasOwnProperty.call(value, key)) {
          const id = extractYouTubeId(value[key]);
          if (id) return id;
        }
      }
      for (const nestedValue of Object.values(value)) {
        if (typeof nestedValue === 'string' || typeof nestedValue === 'object') {
          const id = extractYouTubeId(nestedValue);
          if (id) return id;
        }
      }
      return null;
    }

    const text = String(value).trim().replace(/\\\//g, '/').replace(/&amp;/gi, '&');
    if (!text) return null;
    if (/^[A-Za-z0-9_-]{11}$/.test(text)) return text;

    const patterns = [
      /(?:youtube(?:-nocookie)?\.com\/(?:watch\?(?:[^#]*?&)?v=|embed\/|v\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/i,
      /(?:youtu\.be\/)([A-Za-z0-9_-]{11})/i
    ];
    for (const pattern of patterns) {
      const match = text.match(pattern);
      if (match) return match[1];
    }
    return null;
  }

  function extractYouTubeIdFromFeature(feature) {
    if (!feature) return null;
    const props = feature.properties || {};
    const directCandidates = [
      feature.videoId, feature.youtubeId, props.videoId, props.youtubeId,
      props.gx_media_links, props.description, props.Description, props.name, props.Name
    ];
    for (const candidate of directCandidates) {
      const id = extractYouTubeId(candidate);
      if (id) return id;
    }
    return null;
  }

  function zoomToActiveLine() {
    if (!activeLine) return;
    try {
      const lineBbox = turf.bbox(activeLine);
      const isMobile = window.innerWidth <= 640;
      const pad = isMobile ? 35 : 65;
      const rightPad = (isSplitMode || isMobile) ? pad : 410;
      map.fitBounds(lineBbox, { padding: { top: pad, bottom: pad, left: pad, right: rightPad }, maxZoom: 16.5, duration: 600 });
    } catch(err) {}
  }

  function toggleSplitMode() {
    isSplitMode = !isSplitMode;
    document.body.classList.toggle('split-mode', isSplitMode);
    document.getElementById('split-btn').innerText = isSplitMode ? '❐' : '◫';
    map.resize();
    setTimeout(() => { map.resize(); map.triggerRepaint(); zoomToActiveLine(); }, 250);
  }

  function updateActiveRouteHighlight(featureId) {
    if (map.getLayer('routes-active-line')) {
      map.setFilter('routes-active-line', ['==', ['id'], featureId !== null ? featureId : -9999]);
    }
  }

  function updateHoverHighlight(featureId) {
    if (map.getLayer('routes-hover-line')) {
      map.setFilter('routes-hover-line', ['==', ['id'], (featureId !== null && featureId !== activeLineId) ? featureId : -9999]);
    }
  }

  // 폴리곤 배열에 BBox(사각형 경계)를 미리 계산해 붙여두는 헬퍼 함수 (연산 속도 50배 향상)
  function preparePolygonIndex(geo) {
    if (!geo || !Array.isArray(geo.features)) return [];
    return geo.features.map(f => {
      try {
        return { feature: f, bbox: turf.bbox(f) };
      } catch (e) {
        return null;
      }
    }).filter(Boolean);
  }

  function findPolygonMatchWithBBox(lon, lat, pt, indexedPolygons) {
    for (let i = 0; i < indexedPolygons.length; i++) {
      const b = indexedPolygons[i].bbox;
      if (lon >= b[0] && lon <= b[2] && lat >= b[1] && lat <= b[3]) {
        if (turf.booleanPointInPolygon(pt, indexedPolygons[i].feature)) {
          return indexedPolygons[i].feature;
        }
      }
    }
    return null;
  }

  // 지도에 레이어를 올리는 함수 (데이터 준비와 지도 스타일 준비가 모두 끝났을 때 단 1회 실행)
  function tryMountRoutesOnMap() {
    if (!isDataInitialized || isMapLayerAdded || !rawGeojsonData) return;
    if (!map.isStyleLoaded()) return;

    isMapLayerAdded = true;
    map.addSource('routes', { type: 'geojson', data: rawGeojsonData });
    map.addLayer({ id: 'routes-hitbox', type: 'line', source: 'routes', layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': 'transparent', 'line-width': 18 } });
    map.addLayer({ id: 'routes-line', type: 'line', source: 'routes', layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': '#00ffff', 'line-width': 2.6, 'line-opacity': 0.65 } });
    map.addLayer({ id: 'routes-hover-line', type: 'line', source: 'routes', layout: { 'line-join': 'round', 'line-cap': 'round' }, filter: ['==', ['id'], -9999], paint: { 'line-color': '#ffffff', 'line-width': 5.8, 'line-opacity': 0.85 } });
    map.addLayer({ id: 'routes-active-line', type: 'line', source: 'routes', layout: { 'line-join': 'round', 'line-cap': 'round' }, filter: ['==', ['id'], -9999], paint: { 'line-color': '#ffe600', 'line-width': 5.5, 'line-opacity': 1.0 } });

    setupMapInteractions();
    resetMapToInitial();
    openRouteFromUrl();

    const badge = document.getElementById('loading-badge');
    if (badge) {
      badge.style.opacity = '0';
      setTimeout(() => badge.remove(), 250);
    }
  }

  // 지도 타일 완료를 기다리지 않고 데이터 즉시 병렬 패치 & BBox 고속 인덱싱
  Promise.all([
    fetch('./routes.geojson').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
    fetch('https://d2ad6b4ur7yvpq.cloudfront.net/naturalearth-3.3.0/ne_110m_admin_0_countries.geojson').then(r => r.json()).catch(() => null),
    fetch('https://raw.githubusercontent.com/southkorea/southkorea-maps/master/kostat/2018/json/skorea-provinces-2018-geo.json').then(r => r.json()).catch(() => null),
    fetch('https://raw.githubusercontent.com/southkorea/southkorea-maps/master/kostat/2018/json/skorea-municipalities-2018-geo.json').then(r => r.json()).catch(() => null)
  ]).then(([routesData, worldGeo, sidoGeo, sigunguGeo]) => {
    rawGeojsonData = routesData;

    // 폴리곤 BBox 인덱스 생성 (단 몇 밀리초 소요)
    const worldIdx = preparePolygonIndex(worldGeo);
    const sidoIdx = preparePolygonIndex(sidoGeo);
    const sigunguIdx = preparePolygonIndex(sigunguGeo);

    rawGeojsonData.features.forEach((f, idx) => {
      f._tempIndex = idx;
      f._timestamp = extractTimestamp(f);
    });

    rawGeojsonData.features.sort((a, b) => a._timestamp - b._timestamp);

    rawGeojsonData.features.forEach((f, index) => {
      f.id = index;
      f._globalId = index + 1;
      f._youtubeId = extractYouTubeIdFromFeature(f);
      f._themes = inferThemesFromFeature(f);

      const p = f.properties || {};
      f.properties = p;

      let c = getCorrectedCountry(f);
      let sidos = new Set();
      let sigs = new Set();

      try {
        const firstCoord = (f.geometry && f.geometry.coordinates) ? getFirstCoordFast(f.geometry.coordinates) : null;
        f._startCoord = firstCoord || [126.9780, 37.5665];
        const lon = f._startCoord[0];
        const lat = f._startCoord[1];
        const startPt = turf.point(f._startCoord);

        if (!c) {
          const isKoreaBox = (lon >= 124.0 && lon <= 132.0 && lat >= 33.0 && lat <= 39.0);
          if (isKoreaBox) {
            c = '대한민국';
          } else if (worldIdx.length > 0) {
            const matchedW = findPolygonMatchWithBBox(lon, lat, startPt, worldIdx);
            if (matchedW) {
              let wName = matchedW.properties.NAME || matchedW.properties.ADMIN || matchedW.properties.name;
              const mapW = { 'South Korea':'대한민국', 'Japan':'일본', 'Taiwan':'대만', 'Singapore':'싱가포르', 'Vietnam':'베트남', 'Canada':'캐나다', 'Russia':'러시아', 'United States of America':'미국', 'United States':'미국', 'South Africa':'남아프리카공화국', 'China':'중국', 'Malaysia':'말레이시아' };
              c = mapW[wName] || wName || '대한민국';
            }
          }
        }
        if (!c) c = '대한민국';
        p.country = c;

        if (c === "대한민국") {
          if (!p.sido && sidoIdx.length > 0) {
            const matchedSido = findPolygonMatchWithBBox(lon, lat, startPt, sidoIdx);
            if (matchedSido) {
              sidos.add(normalizeSido(matchedSido.properties.name || matchedSido.properties.CTP_KOR_NM));
            }
          }
          if (!p.sigungu && sigunguIdx.length > 0) {
            const matchedSig = findPolygonMatchWithBBox(lon, lat, startPt, sigunguIdx);
            if (matchedSig) {
              sigs.add((matchedSig.properties.name || matchedSig.properties.SIG_KOR_NM || "").trim());
            }
          }
        }
      } catch (e) {}

      if (p.sido && sidos.size === 0) {
        p.sido.split(',').forEach(s => sidos.add(normalizeSido(s)));
      }
      if (p.sigungu && sigs.size === 0) {
        p.sigungu.split(',').forEach(s => sigs.add(s.trim()));
      }

      p.sido = sidos.size > 0 ? Array.from(sidos).join(', ') : (normalizeSido(p.sido) || "");
      p.sigungu = sigs.size > 0 ? Array.from(sigs).join(', ') : (p.sigungu || "");

      const yr = extractYear(f);
      if (yr) availableYears.add(yr);

      if (!adminHierarchy[c]) adminHierarchy[c] = {};
      if (c === "대한민국") {
        const sdArr = p.sido.split(',').map(s => normalizeSido(s)).filter(Boolean);
        const sigArr = p.sigungu.split(',').map(s => s.trim()).filter(Boolean);

        sdArr.forEach(sd => {
          if (sd !== "-" && sd !== "") {
            if (!adminHierarchy[c][sd]) adminHierarchy[c][sd] = new Set();
            sigArr.forEach(sg => {
              if (sg !== "-" && sg !== "") {
                if (sd === "서울특별시") {
                  if (SEOUL_DISTRICTS.has(sg)) adminHierarchy[c][sd].add(sg);
                } else {
                  if (!SEOUL_DISTRICTS.has(sg)) adminHierarchy[c][sd].add(sg);
                }
              }
            });
          }
        });
      }
    });

    const sortedYears = Array.from(availableYears).sort((a, b) => b.localeCompare(a));
    document.getElementById('year-checkboxes').innerHTML = sortedYears.map(yr => {
      selectedYears.add(yr);
      return `<label class="checkbox-label"><input type="checkbox" value="${yr}" checked onchange="onYearChange(this)"> ${yr}년</label>`;
    }).join('');

    document.getElementById('theme-checkboxes').innerHTML = THEME_DEFINITIONS.map(t => `
      <label class="checkbox-label"><input type="checkbox" value="${t.key}" checked onchange="onThemeChange(this)"> ${t.label}</label>
    `).join('');

    buildUnifiedFilterDropdowns();
    isDataInitialized = true;
    tryMountRoutesOnMap();
  }).catch(err => {
    console.error("초기 데이터 로드 오류:", err);
    const badge = document.getElementById('loading-badge');
    if (badge) {
      badge.innerText = '❌ 데이터를 불러오지 못했습니다. 새로고침 해주세요.';
      badge.style.color = '#ff4d4f';
    }
  });

  map.on('styledata', () => {
    tryMountRoutesOnMap();
  });
  map.on('load', () => {
    tryMountRoutesOnMap();
  });

  function setupMapInteractions() {
    const hoverPopup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 10 });

    map.on('mousemove', 'routes-hitbox', (e) => {
      map.getCanvas().style.cursor = 'pointer';
      const bbox = [[e.point.x - 6, e.point.y - 6], [e.point.x + 6, e.point.y + 6]];
      const rendered = map.queryRenderedFeatures(bbox, { layers: ['routes-hitbox'] });
      const uniqueIds = new Set();
      rendered.forEach(rf => {
        const fid = rf.id !== undefined ? rf.id : rf.properties.id;
        if (fid !== undefined) uniqueIds.add(fid);
      });

      let targetHoverId = null;
      if (activeLineId !== null && uniqueIds.has(activeLineId)) {
        targetHoverId = activeLineId;
      } else {
        const firstFeat = e.features[0];
        targetHoverId = firstFeat.id !== undefined ? firstFeat.id : firstFeat.properties.id;
      }

      hoveredLineId = targetHoverId;
      updateHoverHighlight(hoveredLineId);

      const origFeat = rawGeojsonData.features[hoveredLineId] || e.features[0];
      const props = origFeat.properties || {};
      const title = props.name || props.Name || '도보 코스';
      const globalId = origFeat._globalId || (hoveredLineId + 1);
      const locTag = formatLocationTag(props);

      let subNotice = '';
      if (activeLineId !== null && hoveredLineId === activeLineId && isClickSeekEnabled) {
        const hoverRatio = calculateClickRatioOnFeature(origFeat, e.lngLat);
        const pct = Math.round(hoverRatio * 100);
        subNotice = `<br><span style="color:#00ffff; font-size:11px;">🎯 클릭 시 이 지점(${pct}%)부터 즉시 재생</span>`;
      } else if (uniqueIds.size > 1) {
        subNotice = `<br><span style="color:#ffe600; font-size:11px;">⚡ 이 지점에 겹친 코스 ${uniqueIds.size}개 (클릭하여 선택)</span>`;
      } else {
        const hoverRatio = calculateClickRatioOnFeature(origFeat, e.lngLat);
        const pct = Math.round(hoverRatio * 100);
        subNotice = `<br><span style="color:#00ffff; font-size:11px;">▶️ 클릭 시 이 지점(${pct}%)부터 재생</span>`;
      }

      hoverPopup.setLngLat(e.lngLat).setHTML(`<strong>${globalId}. ${title}</strong>${locTag ? '<br><span style="color:#aaa; font-size:11px;">' + locTag + '</span>' : ''}${subNotice}`).addTo(map);
    });

    map.on('mouseleave', 'routes-hitbox', () => {
      map.getCanvas().style.cursor = '';
      hoveredLineId = null;
      updateHoverHighlight(null);
      hoverPopup.remove();
    });

    map.on('click', 'routes-hitbox', (e) => {
      const bbox = [[e.point.x - 7, e.point.y - 7], [e.point.x + 7, e.point.y + 7]];
      const rendered = map.queryRenderedFeatures(bbox, { layers: ['routes-hitbox'] });

      const uniqueIds = [];
      const seen = new Set();
      rendered.forEach(rf => {
        const fid = rf.id !== undefined ? rf.id : rf.properties.id;
        if (fid !== undefined && !seen.has(fid)) {
          seen.add(fid);
          uniqueIds.push(fid);
        }
      });

      if (uniqueIds.length === 0) return;

      updateOverlapSwitchButton(e.lngLat, uniqueIds);

      if (isClickSeekEnabled && activeLine && uniqueIds.includes(activeLineId) && currentCleanLineTurf && currentLineLengthKm > 0) {
        if (activeOverlapPopup) { activeOverlapPopup.remove(); activeOverlapPopup = null; }
        seekActiveRouteToLngLat(e.lngLat);
        return;
      }

      if (uniqueIds.length > 1) {
        showOverlapSelectionPopup(e.lngLat, uniqueIds);
      } else {
        const targetFeature = rawGeojsonData.features.find(f => f.id === uniqueIds[0]);
        if (targetFeature) {
          playRouteFeature(targetFeature, e.lngLat);
        }
      }
    });
  }

  function seekActiveRouteToLngLat(lngLat) {
    if (!activeLine || !currentCleanLineTurf || currentLineLengthKm <= 0) return;
    try {
      const clickedPt = turf.point([lngLat.lng, lngLat.lat]);
      const snapped = turf.nearestPointOnLine(currentCleanLineTurf, clickedPt, { units: 'kilometers' });
      if (snapped && snapped.properties && typeof snapped.properties.location === 'number') {
        const ratio = Math.min(1, Math.max(0, snapped.properties.location / currentLineLengthKm));
        if (walkerMarker && snapped.geometry && snapped.geometry.coordinates) {
          walkerMarker.setLngLat(snapped.geometry.coordinates);
        }
        if (playerReady && player && typeof player.getDuration === 'function') {
          const dur = player.getDuration();
          if (dur > 0) {
            player.seekTo(dur * ratio, true);
          } else {
            pendingSeekRatio = ratio;
          }
        } else {
          pendingSeekRatio = ratio;
        }
      }
    } catch (err) {}
  }

  function updateOverlapSwitchButton(lngLat, uniqueIds) {
    const btn = document.getElementById('btn-overlap-switch');
    if (!btn) return;
    if (uniqueIds && uniqueIds.length > 1) {
      lastOverlapInfo = { lngLat, ids: uniqueIds };
      btn.style.display = 'inline-flex';
      btn.innerText = `📑 겹친 코스(${uniqueIds.length})`;
    } else {
      lastOverlapInfo = null;
      btn.style.display = 'none';
    }
  }

  function reopenOverlapPopup() {
    if (!lastOverlapInfo) return;
    showOverlapSelectionPopup(lastOverlapInfo.lngLat, lastOverlapInfo.ids);
  }

  function showOverlapSelectionPopup(lngLat, featureIds) {
    if (activeOverlapPopup) activeOverlapPopup.remove();

    lastOverlapInfo = { lngLat, ids: featureIds };
    const itemsHtml = featureIds.map(fid => {
      const f = rawGeojsonData.features.find(item => item.id === fid);
      if (!f) return '';
      const p = f.properties || {};
      const title = p.name || p.Name || '도보 코스';
      const ratio = calculateClickRatioOnFeature(f, lngLat);
      const pct = Math.round(ratio * 100);
      const isCurrent = (fid === activeLineId) ? 'style="border:1px solid #ffe600;"' : '';
      return `<div class="overlap-item" ${isCurrent} onclick="selectFromOverlapPopup(${fid}, ${lngLat.lng}, ${lngLat.lat})">
        <strong>#${f._globalId}</strong> ${title} <span style="color:#00ffff; font-size:10.5px;">(${pct}% 지점)</span>
      </div>`;
    }).join('');

    const html = `
      <div class="overlap-popup-title">📍 이 구간을 지나는 코스 (${featureIds.length}개)</div>
      <div class="overlap-list">${itemsHtml}</div>
    `;

    activeOverlapPopup = new maplibregl.Popup({ closeButton: true, closeOnClick: true, offset: 12 })
      .setLngLat(lngLat)
      .setHTML(html)
      .addTo(map);
  }

  window.selectFromOverlapPopup = function(featureId, lng, lat) {
    if (activeOverlapPopup) {
      activeOverlapPopup.remove();
      activeOverlapPopup = null;
    }
    const feature = rawGeojsonData.features.find(f => f.id === featureId);
    if (feature) {
      const clickLngLat = (typeof lng === 'number' && typeof lat === 'number') ? { lng, lat } : null;
      playRouteFeature(feature, clickLngLat);
    }
  };

  function openRouteFromUrl() {
    const params = new URLSearchParams(window.location.search);
    const routeCode = params.get('route');
    if (!routeCode || !rawGeojsonData) return;

    const feature = rawGeojsonData.features.find(f => {
      const p = f.properties || {};
      return String(p.code || '').trim().toLowerCase() === routeCode.trim().toLowerCase();
    });

    if (feature) playRouteFeature(feature, null);
  }

  function playRouteFeature(feature, clickedLngLat = null) {
    const isSameFeature = (activeLine && activeLine.id === feature.id);
    activeLine = feature;
    activeLineId = activeLine.id !== undefined ? activeLine.id : activeLine.properties.id;

    const props = activeLine.properties || {};
    const videoId = activeLine._youtubeId || extractYouTubeIdFromFeature(activeLine);
    activeLine._youtubeId = videoId || null;

    if (props.code) {
      const newUrl = `${window.location.pathname}?route=${encodeURIComponent(props.code)}`;
      window.history.replaceState({ path: newUrl }, '', newUrl);
    }

    const globalId = activeLine._globalId || (activeLine.id !== undefined ? activeLine.id + 1 : '');
    const title = `${globalId}. ${props.name || props.Name || '도보 코스'}`;

    const initialRatio = (clickedLngLat && isClickSeekEnabled) ? calculateClickRatioOnFeature(activeLine, clickedLngLat) : 0;

    updateHoverHighlight(null);
    updateActiveRouteHighlight(activeLineId);
    setupRouteMarkers(activeLine, initialRatio);

    document.getElementById('video-title').innerText = videoId ? title : `${title} (영상 연결 정보 없음)`;
    document.getElementById('player-panel').style.display = 'flex';

    if (currentMode === 'map' && !clickedLngLat) {
      zoomToActiveLine();
    } else if (currentMode === 'list') {
      updateListActiveHighlight();
    }

    if (videoId) {
      if (isSameFeature && playerReady && player && typeof player.getDuration === 'function' && player.getDuration() > 0) {
        player.seekTo(player.getDuration() * initialRatio, true);
      } else {
        loadRouteVideo(videoId, initialRatio);
      }
    } else if (player && playerReady && typeof player.stopVideo === 'function') {
      try { player.stopVideo(); } catch (e) {}
    }

    setTimeout(() => {
      if (playerReady && player && typeof player.setSize === 'function') {
        const pc = document.getElementById('player-container');
        if (pc) player.setSize(pc.clientWidth, pc.clientHeight);
      }
    }, 50);
  }

  function closePlayer() {
    document.getElementById('player-panel').style.display = 'none';
    if (isSplitMode && currentMode === 'map') toggleSplitMode();

    pendingVideoId = null;
    pendingSeekRatio = null;
    if (playerReady && player && typeof player.stopVideo === 'function') {
      player.stopVideo();
    }

    activeLine = null;
    activeLineId = null;
    clearRouteMarkers();
    updateActiveRouteHighlight(null);
    updateHoverHighlight(null);
    document.getElementById('btn-overlap-switch').style.display = 'none';
    window.history.replaceState({}, '', window.location.pathname);

    document.getElementById('video-title').innerText = "코스 명칭";
    if (currentMode === 'list') updateListActiveHighlight();
  }

  function onYearChange(cb) {
    if (cb.checked) selectedYears.add(cb.value);
    else selectedYears.delete(cb.value);
    applyUnifiedFilter(true);
  }

  function onThemeChange(cb) {
    if (cb.checked) selectedThemes.add(cb.value);
    else selectedThemes.delete(cb.value);
    applyUnifiedFilter(true);
  }

  function buildUnifiedFilterDropdowns() {
    const cSel = document.getElementById('country-select');
    const sdSel = document.getElementById('sido-select');
    const sgSel = document.getElementById('sigungu-select');

    cSel.innerHTML = `<option value="ALL">${formatCountryLabel('ALL')}</option>`;
    const countries = Object.keys(adminHierarchy).sort((a, b) => (a === '대한민국' ? -1 : b === '대한민국' ? 1 : a.localeCompare(b)));
    countries.forEach(country => {
      cSel.innerHTML += `<option value="${country}">${formatCountryLabel(country)}</option>`;
    });

    cSel.addEventListener('change', () => {
      const c = cSel.value;
      sdSel.innerHTML = `<option value="ALL">${formatSidoLabel('ALL')}</option>`;
      sgSel.innerHTML = `<option value="ALL">${formatSigunguLabel('ALL')}</option>`;

      if (c === '대한민국' && adminHierarchy[c]) {
        sdSel.disabled = false;
        SIDO_SORT_ORDER.forEach(sido => {
          if (adminHierarchy[c][sido]) sdSel.innerHTML += `<option value="${sido}">${formatSidoLabel(sido)}</option>`;
        });
        sgSel.disabled = true;
      } else {
        sdSel.disabled = true;
        sgSel.disabled = true;
      }
      applyUnifiedFilter(true);
    });

    sdSel.addEventListener('change', () => {
      const c = cSel.value;
      const s = sdSel.value;
      sgSel.innerHTML = `<option value="ALL">${formatSigunguLabel('ALL')}</option>`;

      if (c === '대한민국' && s !== 'ALL' && adminHierarchy[c] && adminHierarchy[c][s]) {
        sgSel.disabled = false;
        Array.from(adminHierarchy[c][s]).sort().forEach(sig => {
          sgSel.innerHTML += `<option value="${sig}">${formatSigunguLabel(sig)}</option>`;
        });
      } else {
        sgSel.disabled = true;
      }
      applyUnifiedFilter(true);
    });

    sgSel.addEventListener('change', () => {
      applyUnifiedFilter(true);
    });
  }

  function getFilteredFeatures(includeSearchQuery = false) {
    if (!rawGeojsonData) return [];
    const c = document.getElementById('country-select').value;
    const sd = document.getElementById('sido-select').value;
    const sgg = document.getElementById('sigungu-select').value;
    const searchVal = includeSearchQuery ? document.getElementById('search-input').value.trim().toLowerCase() : '';

    return rawGeojsonData.features.filter(f => {
      const p = f.properties || {};
      if (c !== 'ALL' && p.country !== c) return false;
      if (c === '대한민국' && sd !== 'ALL') {
        const sidos = (p.sido || "").split(',').map(s => normalizeSido(s));
        if (!sidos.includes(sd)) return false;
      }
      if (c === '대한민국' && sd !== 'ALL' && sgg !== 'ALL') {
        const sigs = (p.sigungu || "").split(',').map(s => s.trim());
        if (!sigs.includes(sgg)) return false;
      }

      const yr = extractYear(f);
      if (yr && !selectedYears.has(yr)) return false;

      if (selectedThemes.size < THEME_DEFINITIONS.length) {
        let hasTheme = false;
        if (f._themes) {
          for (const t of f._themes) {
            if (selectedThemes.has(t)) { hasTheme = true; break; }
          }
        }
        if (!hasTheme) return false;
      }

      if (searchVal) {
        const title = (p.name || p.Name || '').toLowerCase();
        const code = String(p.code || '').toLowerCase();
        const globalIdStr = String(f._globalId);
        if (!title.includes(searchVal) && !code.includes(searchVal) && !globalIdStr.includes(searchVal)) {
          return false;
        }
      }
      return true;
    });
  }

  function applyUnifiedFilter(shouldFitBounds = true) {
    if (!rawGeojsonData) return;
    const filtered = getFilteredFeatures(false);
    const matchedIds = filtered.map(f => f.id);
    const filterExpression = matchedIds.length === rawGeojsonData.features.length ? null : ['in', ['id'], ['literal', matchedIds]];

    if (map.getLayer('routes-line')) {
      map.setFilter('routes-line', filterExpression);
      map.setFilter('routes-hitbox', filterExpression);
    }

    if (currentMode === 'map' && shouldFitBounds && filtered.length > 0) {
      try {
        const fc = turf.featureCollection(filtered);
        const bbox = turf.bbox(fc);
        map.fitBounds(bbox, { padding: window.innerWidth <= 640 ? 40 : 80, maxZoom: 15, duration: 700 });
      } catch(e) {}
    }

    if (currentMode === 'list') {
      renderRouteList();
    }
  }

  function playRouteById(featureId) {
    if (!rawGeojsonData || !Array.isArray(rawGeojsonData.features)) return;
    const feature = rawGeojsonData.features.find(f => f.id === featureId);
    if (feature) playRouteFeature(feature, null);
  }

  // 리스트 모드 가상 스크롤
  const listScrollAreaEl = document.getElementById('list-scroll-area');
  listScrollAreaEl.addEventListener('scroll', () => {
    if (listScrollAreaEl.scrollTop + listScrollAreaEl.clientHeight >= listScrollAreaEl.scrollHeight - 250) {
      appendMoreRouteListItems();
    }
  });

  function renderRouteList() {
    currentListFeatures = getFilteredFeatures(true);
    currentListFeatures.sort((a, b) => sortAscending ? (a._timestamp - b._timestamp) : (b._timestamp - a._timestamp));
    document.getElementById('list-count-label').innerText = `총 ${currentListFeatures.length}개 코스`;

    listScrollAreaEl.innerHTML = '';
    listScrollAreaEl.scrollTop = 0;
    renderedListCount = 0;

    if (currentListFeatures.length === 0) {
      listScrollAreaEl.innerHTML = `<div style="text-align:center; color:#888; padding:30px;">조건에 일치하는 워킹 코스가 없습니다.</div>`;
      return;
    }

    appendMoreRouteListItems();
  }

  function appendMoreRouteListItems() {
    if (renderedListCount >= currentListFeatures.length) return;
    const nextBatch = currentListFeatures.slice(renderedListCount, renderedListCount + LIST_PAGE_SIZE);
    const themeLabelMap = Object.fromEntries(THEME_DEFINITIONS.map(t => [t.key, t.label]));

    let html = '';
    nextBatch.forEach((f) => {
      const props = f.properties || {};
      const title = props.name || props.Name || '도보 코스';
      const locTag = formatLocationTag(props);
      const isPlaying = (activeLineId === f.id);
      const badges = f._themes ? Array.from(f._themes).map(k => `<span class="theme-badge">${themeLabelMap[k] || k}</span>`).join('') : '';

      html += `
        <div class="route-item ${isPlaying ? 'active-playing' : ''}" data-fid="${f.id}" onclick="playRouteById(${f.id})">
          <div class="route-number">${f._globalId}</div>
          <div class="route-details">
            <div class="route-item-title">${title}</div>
            <div class="route-item-meta">
              <span>${locTag}</span>
              ${props.code ? `<span style="color:#888;">(${props.code})</span>` : ''}
              ${badges}
            </div>
          </div>
        </div>
      `;
    });

    listScrollAreaEl.insertAdjacentHTML('beforeend', html);
    renderedListCount += nextBatch.length;
  }

  function updateListActiveHighlight() {
    document.querySelectorAll('#list-scroll-area .route-item').forEach(el => {
      const fid = parseInt(el.getAttribute('data-fid'), 10);
      el.classList.toggle('active-playing', fid === activeLineId);
    });
  }
</script>
</body>
</html>
