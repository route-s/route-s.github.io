<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>ROUTE S - 아카이브 지도</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    /* 메인 앱 컨테이너 */
    #app-container {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
    }

    #map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0; left: 0;
      transition: height 0.3s ease, top 0.3s ease;
    }

    /* 좌측 상단 행정구역 3단 필터 바 */
    #filter-container {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 100;
      background: rgba(18, 20, 26, 0.92);
      padding: 10px 14px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.15);
      display: flex;
      gap: 8px;
      align-items: center;
      backdrop-filter: blur(8px);
    }
    .filter-select {
      background: #252836;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }
    .filter-select:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* 유튜브 플레이어 패널 (기본: 우측 상단 플로팅 팝업) */
    #player-panel {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 380px;
      max-width: calc(100vw - 30px);
      background: rgba(18, 20, 26, 0.95);
      color: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.8);
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 100;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.12);
      transition: all 0.3s ease;
    }
    #player-container { width: 100%; height: 215px; background: #000; position: relative; }
    #player-container iframe { width: 100%; height: 100%; border: none; }
    #info-box { padding: 12px 16px; background: rgba(22, 25, 34, 0.98); }
    #video-title { font-size: 15px; font-weight: bold; margin-bottom: 4px; color: #00ffff; line-height: 1.3; }
    #video-guide { font-size: 11px; color: #888; }

    /* 패널 제어 버튼들 */
    .panel-btn {
      position: absolute; top: 8px; background: rgba(0,0,0,0.6);
      color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px;
      width: 28px; height: 28px; cursor: pointer; font-size: 14px;
      display: flex; align-items: center; justify-content: center; z-index: 101;
      transition: background 0.2s;
    }
    .panel-btn:hover { background: rgba(0,206,209,0.8); color: #000; }
    #close-btn { right: 8px; font-size: 16px; }
    #split-btn { right: 42px; font-size: 13px; }

    /* === [상하 분할 모드 스타일] === */
    body.split-mode #player-panel {
      position: relative;
      top: 0; left: 0; right: 0;
      width: 100%;
      max-width: 100%;
      height: 50vh;
      border-radius: 0;
      border: none;
      border-bottom: 2px solid #00ffff;
      box-shadow: 0 4px 20px rgba(0,0,0,0.9);
      display: flex;
    }
    body.split-mode #player-container {
      flex: 1;
      height: calc(100% - 55px);
    }
    body.split-mode #map {
      top: 50vh;
      height: 50vh;
    }
    body.split-mode #filter-container {
      top: calc(50vh + 15px);
    }

    /* 제비꼬리 화살표 */
    .arrow-marker {
      width: 24px;
      height: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      transition: transform 0.25s linear;
    }
    .arrow-marker svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 5px rgba(255, 71, 87, 0.9)) drop-shadow(0 0 2px #000);
    }

    .maplibregl-popup-content {
      background: rgba(15, 17, 21, 0.95);
      color: #fff;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.15);
    }
  </style>
</head>
<body>

<div id="app-container">
  <!-- 유튜브 플레이어 패널 -->
  <div id="player-panel">
    <button id="split-btn" class="panel-btn" onclick="toggleSplitMode()" title="화면 상하 분할 / 팝업 토글">◫</button>
    <button id="close-btn" class="panel-btn" onclick="closePlayer()" title="닫기">×</button>
    <div id="player-container"><div id="yt-player"></div></div>
    <div id="info-box">
      <div id="video-title">코스 명칭</div>
      <div id="video-guide">💡 지도 위 경로를 클릭하면 해당 위치 영상으로 즉시 이동합니다.</div>
    </div>
  </div>

  <!-- 행정구역 3단 필터 -->
  <div id="filter-container">
    <select id="country-select" class="filter-select">
      <option value="ALL">1단계: 국가 전체</option>
    </select>
    <select id="sido-select" class="filter-select" disabled>
      <option value="ALL">2단계: 시·도 전체</option>
    </select>
    <select id="sigungu-select" class="filter-select" disabled>
      <option value="ALL">3단계: 시·군·구 전체</option>
    </select>
  </div>

  <!-- 지도 컨테이너 -->
  <div id="map"></div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
  let player = null;
  let activeLine = null;
  let trackingMarker = null;
  let arrowEl = null;
  let syncTimer = null;
  let rawGeojsonData = null;
  let adminHierarchy = {};
  let ytApiReady = false;
  let isSplitMode = false;

  function onYouTubeIframeAPIReady() {
    ytApiReady = true;
    player = new YT.Player('yt-player', {
      height: '100%',
      width: '100%',
      playerVars: { 'autoplay': 1, 'controls': 1, 'rel': 0 },
      events: { 'onStateChange': onPlayerStateChange }
    });
  }

  const map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      sources: {
        'esri-dark-base': {
          type: 'raster',
          tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}'],
          tileSize: 256
        },
        'esri-dark-reference': {
          type: 'raster',
          tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}'],
          tileSize: 256
        }
      },
      layers: [
        { id: 'dark-base', type: 'raster', source: 'esri-dark-base', minzoom: 0, maxzoom: 16 },
        { id: 'dark-ref', type: 'raster', source: 'esri-dark-reference', minzoom: 0, maxzoom: 16 }
      ]
    },
    center: [126.9780, 37.5665],
    zoom: 11
  });

  arrowEl = document.createElement('div');
  arrowEl.className = 'arrow-marker';
  arrowEl.innerHTML = `
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M12 2L21 21L12 16.5L3 21L12 2Z" fill="#ff4757" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"/>
    </svg>
  `;
  trackingMarker = new maplibregl.Marker({ element: arrowEl, rotationAlignment: 'map' });

  function updateMarkerPosition(currentLen, totalLen) {
    if (!activeLine || totalLen <= 0) return;
    try {
      const currentPos = turf.along(activeLine, currentLen, { units: 'kilometers' });
      const delta = Math.min(0.015, (totalLen - currentLen) / 2);
      let targetLen = currentLen + delta;
      if (targetLen > totalLen) targetLen = totalLen;

      const lookAheadPos = turf.along(activeLine, targetLen, { units: 'kilometers' });

      let bearing = 0;
      if (currentLen < totalLen) {
        bearing = turf.bearing(currentPos, lookAheadPos);
      }

      trackingMarker.setLngLat(currentPos.geometry.coordinates);
      trackingMarker.setRotation(bearing);
    } catch(e) {}
  }

  // 선택된 코스로 최적 줌인하는 공통 헬퍼
  function zoomToActiveLine() {
    if (!activeLine) return;
    try {
      const lineBbox = turf.bbox(activeLine);
      if (isSplitMode) {
        // 상하 분할 시: 아래쪽 50% 지도 정중앙에 시원하게 맞춤
        map.fitBounds(lineBbox, {
          padding: { top: 60, bottom: 60, left: 60, right: 60 },
          maxZoom: 15.5,
          duration: 900
        });
      } else {
        // 팝업 모드 시: 우측 플레이어 패널을 피해서 중심 배치
        map.fitBounds(lineBbox, {
          padding: { top: 70, bottom: 70, left: 70, right: 420 },
          maxZoom: 15.5,
          duration: 900
        });
      }
    } catch(err) {}
  }

  // 상하 분할 모드 토글 함수
  function toggleSplitMode() {
    isSplitMode = !isSplitMode;
    document.body.classList.toggle('split-mode', isSplitMode);
    document.getElementById('split-btn').innerText = isSplitMode ? '❐' : '◫';

    setTimeout(() => {
      map.resize(); // 뷰포트 크기 변경 알림
      zoomToActiveLine(); // 변경된 화면에 맞춰 코스 재정렬
    }, 320);
  }

  map.on('load', () => {
    fetch('./routes.geojson')
      .then(res => res.json())
      .then(data => {
        rawGeojsonData = data;

        rawGeojsonData.features.forEach((f, idx) => {
          f.id = idx;
          const p = f.properties || {};
          const c = p.country || "대한민국";
          const sidos = (p.sido || "").split(',').map(s => s.trim()).filter(Boolean);
          const sigs = (p.sigungu || "").split(',').map(s => s.trim()).filter(Boolean);

          if (!adminHierarchy[c]) adminHierarchy[c] = {};
          if (c === "대한민국") {
            sidos.forEach(sd => {
              if (sd !== "-") {
                if (!adminHierarchy[c][sd]) adminHierarchy[c][sd] = new Set();
                sigs.forEach(sg => { if (sg !== "-") adminHierarchy[c][sd].add(sg); });
              }
            });
          }
        });

        map.addSource('routes', {
          type: 'geojson',
          data: rawGeojsonData
        });

        map.addLayer({
          id: 'routes-line',
          type: 'line',
          source: 'routes',
          layout: { 'line-join': 'round', 'line-cap': 'round' },
          paint: {
            'line-color': '#00ffff',
            'line-width': 2.8,
            'line-opacity': 0.85
          }
        });

        buildDynamicFilters();
      });

    const hoverPopup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 10 });
    map.on('mouseenter', 'routes-line', (e) => {
      map.getCanvas().style.cursor = 'pointer';
      const props = e.features[0].properties || {};
      const title = props.name || props.Name || '도보 코스';
      let locTag = '';
      if (props.country === '대한민국' && props.sido) {
        locTag = `<br><span style="color:#aaa; font-size:11px;">[${props.sido} ${props.sigungu || ''}]</span>`;
      } else if (props.country) {
        locTag = `<br><span style="color:#aaa; font-size:11px;">[${props.country}]</span>`;
      }
      hoverPopup.setLngLat(e.lngLat).setHTML(`<strong>${title}</strong>${locTag}<br><span style="color:#00ffff;">클릭하여 영상 시청</span>`).addTo(map);
    });

    map.on('mouseleave', 'routes-line', () => {
      map.getCanvas().style.cursor = '';
      hoverPopup.remove();
    });

    // 코스 클릭 시
    map.on('click', 'routes-line', (e) => {
      activeLine = e.features[0];
      const props = activeLine.properties || {};
      const title = props.name || props.Name || '도보 코스';
      const rawDesc = props.description || props.Description || '';

      const match = rawDesc.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{11})/);
      const videoId = match ? match[1] : null;

      if (!videoId) {
        alert("이 코스에 연결된 유튜브 링크를 찾을 수 없습니다.");
        return;
      }

      document.getElementById('player-panel').style.display = 'flex';
      document.getElementById('video-title').innerText = title;

      zoomToActiveLine();

      if (ytApiReady && player && typeof player.loadVideoById === 'function') {
        player.loadVideoById(videoId);
      } else {
        document.getElementById('player-container').innerHTML = 
          `<iframe id="yt-player" src="https://www.youtube.com/embed/${videoId}?autoplay=1&enablejsapi=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
      }

      try {
        const clickedCoords = [e.lngLat.lng, e.lngLat.lat];
        const snapped = turf.nearestPointOnLine(activeLine, turf.point(clickedCoords));
        const totalLen = turf.length(activeLine, { units: 'kilometers' });
        const sliced = turf.lineSlice(turf.point(activeLine.geometry.coordinates[0]), snapped, activeLine);
        const curLen = turf.length(sliced, { units: 'kilometers' });

        setTimeout(() => {
          if (player && typeof player.getDuration === 'function') {
            const dur = player.getDuration() || 0;
            if (dur > 0 && totalLen > 0) player.seekTo((curLen / totalLen) * dur, true);
          }
        }, 700);

        trackingMarker.addTo(map);
        updateMarkerPosition(curLen, totalLen);
      } catch(err) {}
    });
  });

  function onPlayerStateChange(event) {
    clearInterval(syncTimer);
    if (event.data === YT.PlayerState.PLAYING && activeLine) {
      syncTimer = setInterval(() => {
        if (!player || typeof player.getCurrentTime !== 'function') return;
        const curTime = player.getCurrentTime();
        const dur = player.getDuration();
        if (!dur || dur === 0) return;

        const totalLen = turf.length(activeLine, { units: 'kilometers' });
        const targetLen = totalLen * (curTime / dur);

        updateMarkerPosition(targetLen, totalLen);
      }, 500);
    }
  }

  function closePlayer() {
    document.getElementById('player-panel').style.display = 'none';
    if (isSplitMode) toggleSplitMode();
    if (player && typeof player.stopVideo === 'function') player.stopVideo();
    clearInterval(syncTimer);
    trackingMarker.remove();
  }

  const countrySelect = document.getElementById('country-select');
  const sidoSelect = document.getElementById('sido-select');
  const sigunguSelect = document.getElementById('sigungu-select');

  function buildDynamicFilters() {
    countrySelect.innerHTML = '<option value="ALL">1단계: 국가 전체</option>';

    const countries = Object.keys(adminHierarchy).sort((a, b) => {
      if (a === '대한민국') return -1;
      if (b === '대한민국') return 1;
      return a.localeCompare(b);
    });

    countries.forEach(country => {
      countrySelect.innerHTML += `<option value="${country}">${country}</option>`;
    });

    countrySelect.addEventListener('change', () => {
      const c = countrySelect.value;
      sidoSelect.innerHTML = '<option value="ALL">2단계: 시·도 전체</option>';
      sigunguSelect.innerHTML = '<option value="ALL">3단계: 시·군·구 전체</option>';

      if (c === '대한민국' && adminHierarchy[c]) {
        sidoSelect.disabled = false;
        Object.keys(adminHierarchy[c]).sort().forEach(sido => {
          sidoSelect.innerHTML += `<option value="${sido}">${sido}</option>`;
        });
        sigunguSelect.disabled = true;
      } else {
        sidoSelect.disabled = true;
        sigunguSelect.disabled = true;
      }
      applyFilter();
    });

    sidoSelect.addEventListener('change', () => {
      const c = countrySelect.value;
      const s = sidoSelect.value;
      sigunguSelect.innerHTML = '<option value="ALL">3단계: 시·군·구 전체</option>';

      if (c === '대한민국' && s !== 'ALL' && adminHierarchy[c] && adminHierarchy[c][s]) {
        sigunguSelect.disabled = false;
        Array.from(adminHierarchy[c][s]).sort().forEach(sig => {
          sigunguSelect.innerHTML += `<option value="${sig}">${sig}</option>`;
        });
      } else {
        sigunguSelect.disabled = true;
      }
      applyFilter();
    });

    sigunguSelect.addEventListener('change', applyFilter);
  }

  function applyFilter() {
    const c = countrySelect.value;
    const sd = sidoSelect.value;
    const sgg = sigunguSelect.value;

    const filteredFeatures = rawGeojsonData.features.filter(f => {
      const p = f.properties || {};
      if (c !== 'ALL' && p.country !== c) return false;
      if (c === '대한민국' && sd !== 'ALL') {
        const sidos = (p.sido || "").split(',').map(s => s.trim());
        if (!sidos.includes(sd)) return false;
      }
      if (c === '대한민국' && sd !== 'ALL' && sgg !== 'ALL') {
        const sigs = (p.sigungu || "").split(',').map(s => s.trim());
        if (!sigs.includes(sgg)) return false;
      }
      return true;
    });

    const matchedIds = filteredFeatures.map(f => f.id);
    if (c === 'ALL') {
      map.setFilter('routes-line', null);
    } else {
      map.setFilter('routes-line', ['in', ['id'], ['literal', matchedIds]]);
    }

    if (filteredFeatures.length > 0) {
      try {
        const fc = turf.featureCollection(filteredFeatures);
        const bbox = turf.bbox(fc);
        map.fitBounds(bbox, { padding: 80, maxZoom: 14, duration: 800 });
      } catch(e) {}
    }
  }
</script>
</body>
</html>
