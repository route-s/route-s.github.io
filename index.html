<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>ROUTE S - 아카이브 지도 & 리스트</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #191a1a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    #app-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .view-pane {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: none;
    }
    .view-pane.active {
      display: flex;
      flex-direction: column;
    }

    #map-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }
    #map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0; left: 0;
    }

    .maplibregl-canvas-container {
      background-color: #1a1a1a;
    }

    /* 상태바 중앙 정렬 및 1줄 고정 */
    .filter-container {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      background: rgba(18, 20, 26, 0.95);
      padding: 6px 10px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.15);
      display: flex;
      gap: 5px;
      align-items: center;
      backdrop-filter: blur(8px);
      flex-wrap: nowrap;
      white-space: nowrap;
    }

    #logo-icon {
      height: 22px;
      width: auto;
      object-fit: contain;
      cursor: pointer;
      border-radius: 4px;
      margin-right: 1px;
      flex-shrink: 0;
    }

    .filter-select {
      background: #252836;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      padding: 5px 6px;
      font-size: 11.5px;
      outline: none;
      cursor: pointer;
      text-overflow: ellipsis;
      overflow: hidden;
      flex-shrink: 1;
    }
    .filter-select:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .search-input {
      background: #252836;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 11.5px;
      outline: none;
      width: 130px;
      flex-shrink: 1;
    }
    .search-input::placeholder { color: #888; }
    .search-input:focus { border-color: #00ffff; }

    .mode-switch {
      background: #252836;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      padding: 2px;
      display: flex;
      gap: 2px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .mode-btn {
      background: transparent;
      border: none;
      color: #aaa;
      padding: 4px 6px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn.active {
      background: #00ffff;
      color: #000;
    }

    .action-btn {
      background: #252836;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 11.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .action-btn:hover { background: #2f3346; }

    .dropdown-multiselect {
      position: relative;
      display: inline-block;
      flex-shrink: 0;
    }
    .dropdown-btn {
      background: #252836;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 11.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .dropdown-btn:hover { background: #2f3346; }
    .dropdown-content {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      margin-top: 4px;
      background: #1e222d;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.7);
      padding: 8px 10px;
      z-index: 102;
      min-width: 120px;
      max-height: 200px;
      overflow-y: auto;
      white-space: nowrap;
    }
    .dropdown-content.show { display: block; }
    .year-checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #ddd;
      font-size: 11.5px;
      padding: 3px 0;
      cursor: pointer;
    }
    .year-checkbox-label:hover { color: #00ffff; }
    .year-checkbox-label input { accent-color: #00ffff; cursor: pointer; }

    #player-panel {
      position: absolute;
      top: 65px;
      right: 15px;
      width: 380px;
      max-width: calc(100vw - 30px);
      background: rgba(18, 20, 26, 0.95);
      color: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.8);
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 100;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.12);
    }
    #player-container { width: 100%; height: 215px; background: #000; position: relative; }
    #player-container iframe { width: 100%; height: 100%; border: none; }
    #info-box { padding: 10px 14px; background: rgba(22, 25, 34, 0.98); }
    #video-title { font-size: 14px; font-weight: bold; color: #00ffff; line-height: 1.3; width: 100%; }

    /* 리스트 모드 레이아웃 */
    #list-view-container {
      width: 100%;
      height: 100%;
      background: #14161c;
      display: flex;
      flex-direction: column;
      padding-top: 65px;
    }
    #list-player-area {
      width: 100%;
      height: 45vh;
      background: #000;
      position: relative;
      flex-shrink: 0;
      border-bottom: 2px solid #00ffff;
      display: flex;
      flex-direction: column;
    }
    
    #list-controls-bar {
      max-width: 900px;
      width: calc(100% - 30px);
      margin: 12px auto 5px auto;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #list-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 10px 15px 15px 15px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }
    .route-item {
      background: rgba(26, 29, 38, 0.85);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 15px;
      transition: all 0.2s;
    }
    .route-item:hover {
      background: rgba(0, 206, 209, 0.15);
      border-color: #00ffff;
      transform: translateY(-1px);
    }
    .route-item.active-playing {
      border-color: #ffe600;
      background: rgba(255, 230, 0, 0.1);
    }
    .route-number {
      font-size: 14px;
      font-weight: bold;
      color: #888;
      min-width: 35px;
    }
    .route-details {
      flex: 1;
    }
    .route-item-title {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }
    .route-item-meta {
      font-size: 11.5px;
      color: #00ffff;
    }

    .panel-btn {
      position: absolute; top: 8px; background: rgba(0,0,0,0.6);
      color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px;
      width: 28px; height: 28px; cursor: pointer; font-size: 14px;
      display: flex; align-items: center; justify-content: center; z-index: 101;
      transition: background 0.2s;
    }
    .panel-btn:hover { background: rgba(0,206,209,0.8); color: #000; }
    #close-btn { right: 8px; font-size: 16px; }
    #split-btn { right: 42px; font-size: 13px; }

    @media (max-width: 768px) {
      .filter-container {
        top: 8px;
        padding: 4px 6px;
        gap: 3px;
      }
      #logo-icon { height: 18px; }
      .filter-select, .dropdown-btn, .action-btn, .search-input {
        padding: 4px 5px;
        font-size: 10.5px;
      }
      .search-input { width: 95px; }
      #player-panel {
        top: 55px;
        left: 10px;
        right: 10px;
        width: calc(100% - 20px);
        max-width: 100%;
      }
      #list-view-container { padding-top: 55px; }
      #list-player-area { height: 32vh; }
      #list-controls-bar { width: calc(100% - 20px); margin: 8px auto 4px auto; }
    }

    body.split-mode #app-container { display: flex; flex-direction: column; }
    body.split-mode #player-panel {
      position: relative; top: 0; left: 0; right: 0; width: 100%; max-width: 100%;
      height: 50vh; border-radius: 0; border: none; border-bottom: 2px solid #00ffff;
      box-shadow: 0 4px 20px rgba(0,0,0,0.9); display: flex;
    }
    body.split-mode #player-container { flex: 1; height: calc(100% - 50px); }
    body.split-mode #map-wrapper { flex: none; height: 50vh; width: 100%; }

    .maplibregl-popup-content {
      background: rgba(15, 17, 21, 0.95);
      color: #fff;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.15);
    }
  </style>
</head>
<body>

<div id="app-container">
  <!-- 1. MAP VIEW PANE -->
  <div id="map-pane" class="view-pane active">
    <div id="player-panel">
      <button id="split-btn" class="panel-btn" onclick="toggleSplitMode()" title="화면 상하 분할 / 팝업 토글">◫</button>
      <button id="close-btn" class="panel-btn" onclick="closePlayer()" title="닫기">×</button>
      <div id="player-container"><div id="yt-player"></div></div>
      <div id="info-box">
        <div id="video-title">코스 명칭</div>
      </div>
    </div>
    <div id="map-wrapper">
      <div id="map"></div>
    </div>
  </div>

  <!-- 2. LIST VIEW PANE -->
  <div id="list-pane" class="view-pane">
    <div id="list-view-container">
      <div id="list-player-area">
        <div id="list-yt-container" style="width:100%; flex:1; background:#000;"></div>
        <div style="background:#1e222d; padding:8px 15px; border-top:1px solid rgba(255,255,255,0.1);">
          <div id="list-video-title" style="color:#00ffff; font-size:13.5px; font-weight:bold; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">재생 중인 코스가 없습니다.</div>
        </div>
      </div>

      <div id="list-controls-bar">
        <input type="text" id="search-input" class="search-input" placeholder="제목 또는 번호 검색" oninput="renderRouteList()" onkeydown="if(event.key==='Enter') { this.blur(); renderRouteList(); }">
        <button id="sort-order-btn" class="action-btn" onclick="toggleSortOrder()" title="정렬 순서 변경">🔄 과거순</button>
      </div>

      <div id="list-scroll-area"></div>
    </div>
  </div>

  <!-- MAP 전용 상단 상태바 -->
  <div id="map-filter-container" class="filter-container">
    <img id="logo-icon" src="./logo.png" alt="ROUTE S" title="ROUTE S 채널 바로가기" onclick="window.open('https://www.youtube.com/@루트에스', '_blank')">

    <div class="mode-switch">
      <button id="btn-map-mode" class="mode-btn active" onclick="switchMode('map')">🗺️ MAP</button>
      <button id="btn-list-mode" class="mode-btn" onclick="switchMode('list')">📜 LIST</button>
    </div>

    <select id="map-country-select" class="filter-select">
      <option value="ALL">1: 국가 전체 (All)</option>
    </select>
    <select id="map-sido-select" class="filter-select" disabled>
      <option value="ALL">2: 시·도 (State)</option>
    </select>
    <select id="map-sigungu-select" class="filter-select" disabled>
      <option value="ALL">3: 시·군·구 (City/Dist.)</option>
    </select>

    <div class="dropdown-multiselect" id="map-year-dropdown-container">
      <button class="dropdown-btn" type="button" onclick="toggleMapYearDropdown()">📅 연도별 ▼</button>
      <div class="dropdown-content" id="map-year-checkboxes"></div>
    </div>
  </div>

  <!-- LIST 전용 상단 상태바 -->
  <div id="list-filter-container" class="filter-container" style="display:none;">
    <img id="logo-icon" src="./logo.png" alt="ROUTE S" title="ROUTE S 채널 바로가기" onclick="window.open('https://www.youtube.com/@루트에스', '_blank')">

    <div class="mode-switch">
      <button class="mode-btn" onclick="switchMode('map')">🗺️ MAP</button>
      <button class="mode-btn active" onclick="switchMode('list')">📜 LIST</button>
    </div>

    <select id="list-country-select" class="filter-select">
      <option value="ALL">1: 국가 전체 (All)</option>
    </select>
    <select id="list-sido-select" class="filter-select" disabled>
      <option value="ALL">2: 시·도 (State)</option>
    </select>
    <select id="list-sigungu-select" class="filter-select" disabled>
      <option value="ALL">3: 시·군·구 (City/Dist.)</option>
    </select>

    <div class="dropdown-multiselect" id="list-year-dropdown-container">
      <button class="dropdown-btn" type="button" onclick="toggleListYearDropdown()">📅 연도별 ▼</button>
      <div class="dropdown-content" id="list-year-checkboxes"></div>
    </div>
  </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
  let player = null;
  let listPlayer = null;
  let activeLine = null;
  let activeLineId = null;
  let hoveredLineId = null;
  let rawGeojsonData = null;
  let adminHierarchy = {};
  let availableYears = new Set();
  let mapSelectedYears = new Set();
  let listSelectedYears = new Set();
  let isSplitMode = false;
  let currentMode = 'map';
  let sortAscending = true;

  const SEOUL_DISTRICTS = new Set([
    "종로구", "중구", "용산구", "성동구", "광진구", "동대문구", "중랑구", "성북구",
    "강북구", "도봉구", "노원구", "은평구", "서대문구", "마포구", "양천구", "강서구",
    "구로구", "금천구", "영등포구", "동작구", "관악구", "서초구", "강남구", "송파구", "강동구"
  ]);

  const COUNTRY_EN_MAP = {
    "대한민국": "South Korea", "일본": "Japan", "싱가포르": "Singapore",
    "남아프리카공화국": "RSA", "대만": "Taiwan", "미국": "USA",
    "베트남": "Vietnam", "캐나다": "Canada", "홍콩": "Hong Kong"
  };

  const SIDO_SHORT_MAP = {
    "서울특별시": "서울", "부산광역시": "부산", "대구광역시": "대구", "인천광역시": "인천",
    "광주광역시": "광주", "대전광역시": "대전", "울산광역시": "울산", "세종특별자치시": "세종",
    "경기도": "경기", "강원특별자치도": "강원", "충청북도": "충북", "충청남도": "충남",
    "전북특별자치도": "전북", "전라남도": "전남", "경상북도": "경북", "경상남도": "경남",
    "제주특별자치도": "제주"
  };

  const SIDO_EN_MAP = {
    "서울특별시": "Seoul", "부산광역시": "Busan", "대구광역시": "Daegu", "인천광역시": "Incheon",
    "광주광역시": "Gwangju", "대전광역시": "Daejeon", "울산광역시": "Ulsan", "세종특별자치시": "Sejong",
    "경기도": "Gyeonggi", "강원특별자치도": "Gangwon", "충청북도": "Chungbuk", "충청남도": "Chungnam",
    "전북특별자치도": "Jeonbuk", "전라남도": "Jeonnam", "경상북도": "Gyeongbuk", "경상남도": "Gyeongnam",
    "제주특별자치도": "Jeju"
  };

  const SIDO_SORT_ORDER = [
    "서울특별시", "부산광역시", "대구광역시", "인천광역시",
    "광주광역시", "대전광역시", "울산광역시", "세종특별자치시",
    "경기도", "강원특별자치도", "충청북도", "충청남도",
    "전북특별자치도", "전라남도", "경상북도", "경상남도", "제주특별자치도"
  ];

  const KOR_SIDO_CODE_MAP = {
    "11": "서울특별시", "21": "부산광역시", "22": "대구광역시", "23": "인천광역시",
    "24": "광주광역시", "25": "대전광역시", "26": "울산광역시", "29": "세종특별자치시",
    "31": "경기도", "32": "강원특별자치도", "33": "충청북도", "34": "충청남도",
    "35": "전북특별자치도", "36": "전라남도", "37": "경상북도", "38": "경상남도", "39": "제주특별자치도"
  };

  const DISTRICT_EN_MAP = {
    "종로구": "Jongno-gu", "중구": "Jung-gu", "용산구": "Yongsan-gu", "성동구": "Seongdong-gu",
    "광진구": "Gwangjin-gu", "동대문구": "Dongdaemun-gu", "중랑구": "Jungnang-gu", "성북구": "Sungbuk-gu",
    "강북구": "Gangbuk-gu", "도봉구": "Dobong-gu", "노원구": "Nowon-gu", "은평구": "Eunpyeong-gu",
    "서대문구": "Seodaemun-gu", "마포구": "Mapo-gu", "양천구": "Yangcheon-gu", "강서구": "Gangseo-gu",
    "구로구": "Guro-gu", "금천구": "Geumcheon-gu", "영등포구": "Yeongdeungpo-gu", "동작구": "Dongjak-gu",
    "관악구": "Gwanak-gu", "서초구": "Seocho-gu", "강남구": "Gangnam-gu", "송파구": "Songpa-gu",
    "강동구": "Gangdong-gu", "고양시덕양구": "Goyang Deogyang", "고양시일산동구": "Ilsandong-gu",
    "고양시일산서구": "Ilsanseo-gu", "성남시분당구": "Bundang-gu", "수원시팔달구": "Paldal-gu",
    "광명시": "Gwangmyeong-si", "제주시": "Jeju-si", "서귀포시": "Seogwipo-si"
  };

  function formatCountryLabel(val) {
    if (val === "ALL") return "1: 국가 전체 (All)";
    return `${val} (${COUNTRY_EN_MAP[val] || val})`;
  }

  function formatSidoLabel(val) {
    if (val === "ALL") return "2: 시·도 (State)";
    return `${SIDO_SHORT_MAP[val] || val} (${SIDO_EN_MAP[val] || val})`;
  }

  function formatSigunguLabel(val) {
    if (val === "ALL") return "3: 시·군·구 (City/Dist.)";
    let en = DISTRICT_EN_MAP[val];
    if (!en) {
      if (val.endsWith('구')) en = val.replace('구', '-gu');
      else if (val.endsWith('시')) en = val.replace('시', '-si');
      else if (val.endsWith('군')) en = val.replace('군', '-gun');
      else en = val;
    }
    return `${val} (${en})`;
  }

  function extractTimestamp(feature) {
    const props = feature.properties || {};
    const text = (props.name || "") + " " + (props.Name || "") + " " + (props.description || "") + " " + (props.Description || "");
    const yearMatch = text.match(/\b(20\d{2})\b/);
    const year = yearMatch ? parseInt(yearMatch[1], 10) : 2020;
    const months = { jan:1, feb:2, mar:3, apr:4, may:5, jun:6, jul:7, aug:8, sep:9, oct:10, nov:11, dec:12 };
    let month = 1;
    const mMatch = text.match(/(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)/i);
    if (mMatch) {
      month = months[mMatch[1].toLowerCase()] || 1;
    } else {
      const korMMatch = text.match(/(\d{1,2})월/);
      if (korMMatch) month = parseInt(korMMatch[1], 10);
    }
    return year * 100 + month;
  }

  function extractYear(feature) {
    const props = feature.properties || {};
    const text = (props.name || "") + " " + (props.Name || "") + " " + (props.description || "") + " " + (props.Description || "");
    const match = text.match(/\b(20\d{2})\b/);
    return match ? match[1] : null;
  }

  function formatLocationTag(props) {
    const country = props.country || "대한민국";
    if (country !== "대한민국") return `[${COUNTRY_EN_MAP[country] || country}]`;

    const sidos = (props.sido || "").split(',').map(s => s.trim()).filter(Boolean);
    const sigs = (props.sigungu || "").split(',').map(s => s.trim()).filter(Boolean);

    if (sigs.length === 0) {
      return sidos.length > 0 ? `[${sidos.map(sd => SIDO_SHORT_MAP[sd] || sd).join(', ')}]` : "";
    }

    let pairs = [];
    sigs.forEach(sig => {
      if (SEOUL_DISTRICTS.has(sig)) {
        pairs.push(`서울 ${sig}`);
      } else {
        let matchedSido = sidos.find(sd => sd !== "서울특별시") || sidos[0] || "경기도";
        pairs.push(`${SIDO_SHORT_MAP[matchedSido] || matchedSido} ${sig}`);
      }
    });

    return `[${pairs.join(', ')}]`;
  }

  function toggleMapYearDropdown() {
    document.getElementById('map-year-checkboxes').classList.toggle('show');
  }

  function toggleListYearDropdown() {
    document.getElementById('list-year-checkboxes').classList.toggle('show');
  }

  window.addEventListener('click', (e) => {
    if (!document.getElementById('map-year-dropdown-container').contains(e.target)) {
      document.getElementById('map-year-checkboxes').classList.remove('show');
    }
    if (!document.getElementById('list-year-dropdown-container').contains(e.target)) {
      document.getElementById('list-year-checkboxes').classList.remove('show');
    }
  });

  // 모드 전환 시 이전 모드의 영상 및 재생 상태를 깔끔하게 초기화
  function switchMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(b => {
      b.classList.toggle('active', (mode === 'map' && b.innerText.includes('MAP')) || (mode === 'list' && b.innerText.includes('LIST')));
    });

    document.getElementById('map-pane').classList.toggle('active', mode === 'map');
    document.getElementById('list-pane').classList.toggle('active', mode === 'list');
    document.getElementById('map-filter-container').style.display = (mode === 'map') ? 'flex' : 'none';
    document.getElementById('list-filter-container').style.display = (mode === 'list') ? 'flex' : 'none';

    // 모드 전환 시 상대방 플레이어 초기화 (재생 중단 및 대기 상태로 전환)
    if (mode === 'map') {
      if (listPlayer && typeof listPlayer.stopVideo === 'function') {
        listPlayer.stopVideo();
      }
      document.getElementById('list-video-title').innerText = "재생 중인 코스가 없습니다.";
      map.resize();
      resetMapToInitial();
    } else {
      closePlayer(); // 지도형 플레이어 패널 닫기 및 정지
      resetListToInitial();
    }
  }

  function resetMapToInitial() {
    const cSel = document.getElementById('map-country-select');
    const sdSel = document.getElementById('map-sido-select');
    cSel.value = "대한민국";
    cSel.dispatchEvent(new Event('change'));
    sdSel.value = "서울특별시";
    sdSel.dispatchEvent(new Event('change'));
  }

  function resetListToInitial() {
    const cSel = document.getElementById('list-country-select');
    const sdSel = document.getElementById('list-sido-select');
    const sgSel = document.getElementById('list-sigungu-select');
    const searchInput = document.getElementById('search-input');

    if (cSel) cSel.value = "ALL";
    if (sdSel) { sdSel.value = "ALL"; sdSel.disabled = true; }
    if (sgSel) { sgSel.value = "ALL"; sgSel.disabled = true; }
    if (searchInput) searchInput.value = "";
    
    availableYears.forEach(yr => listSelectedYears.add(yr));
    sortAscending = true;
    document.getElementById('sort-order-btn').innerText = "🔄 과거순";

    renderRouteList();
  }

  function toggleSortOrder() {
    sortAscending = !sortAscending;
    const btn = document.getElementById('sort-order-btn');
    btn.innerText = sortAscending ? "🔄 과거순" : "🔄 최신순";
    renderRouteList();
  }

  // 유튜브 API 글로벌 콜백: 양쪽 플레이어 동시 생성 보장
  function onYouTubeIframeAPIReady() {
    player = new YT.Player('yt-player', {
      height: '100%', width: '100%',
      playerVars: { 'autoplay': 1, 'controls': 1, 'rel': 0, 'enablejsapi': 1, 'origin': window.location.origin }
    });
    listPlayer = new YT.Player('list-yt-container', {
      height: '100%', width: '100%',
      playerVars: { 'autoplay': 1, 'controls': 1, 'rel': 0, 'enablejsapi': 1, 'origin': window.location.origin }
    });
  }

  const map = new maplibregl.Map({
    container: 'map',
    scrollZoom: true, boxZoom: true, dragRotate: true, dragPan: true, maxZoom: 19,
    style: {
      version: 8,
      sources: {
        'osm-tiles': {
          type: 'raster',
          tiles: [
            'https://a.tile.openstreetmap.org/{z}/{x}/{y}.png',
            'https://b.tile.openstreetmap.org/{z}/{x}/{y}.png',
            'https://c.tile.openstreetmap.org/{z}/{x}/{y}.png'
          ],
          tileSize: 256,
          attribution: '&copy; OpenStreetMap contributors'
        }
      },
      layers: [{
        id: 'osm-tiles-layer', type: 'raster', source: 'osm-tiles', minzoom: 0, maxzoom: 19,
        paint: { 'raster-brightness-max': 0.35, 'raster-brightness-min': 0.05, 'raster-contrast': 0.25, 'raster-saturation': -1.0 }
      }]
    },
    center: [126.9780, 37.5665], zoom: 11
  });

  map.addControl(new maplibregl.NavigationControl(), 'bottom-right');

  function extractYouTubeId(url) {
    if (!url) return null;
    const regExp = /(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|shorts\/))([\w-]{11})/;
    const match = url.match(regExp);
    return match ? match[1] : null;
  }

  function zoomToActiveLine() {
    if (!activeLine) return;
    try {
      const lineBbox = turf.bbox(activeLine);
      const isMobile = window.innerWidth <= 640;
      const pad = isMobile ? 30 : 60;
      const rightPad = (isSplitMode || isMobile) ? pad : 410;
      map.fitBounds(lineBbox, { padding: { top: pad, bottom: pad, left: pad, right: rightPad }, maxZoom: 16.5, duration: 600 });
    } catch(err) {}
  }

  function toggleSplitMode() {
    isSplitMode = !isSplitMode;
    document.body.classList.toggle('split-mode', isSplitMode);
    document.getElementById('split-btn').innerText = isSplitMode ? '❐' : '◫';
    map.resize();
    setTimeout(() => { map.resize(); map.triggerRepaint(); zoomToActiveLine(); }, 250);
  }

  function updateActiveRouteHighlight(featureId) {
    if (map.getLayer('routes-active-line')) {
      map.setFilter('routes-active-line', ['==', ['id'], featureId !== null ? featureId : -9999]);
    }
  }

  function updateHoverHighlight(featureId) {
    if (map.getLayer('routes-hover-line')) {
      map.setFilter('routes-hover-line', ['==', ['id'], (featureId !== null && featureId !== activeLineId) ? featureId : -9999]);
    }
  }

  map.on('load', () => {
    Promise.all([
      fetch('./routes.geojson?t=' + Date.now()).then(r => r.json()),
      fetch('https://d2ad6b4ur7yvpq.cloudfront.net/naturalearth-3.3.0/ne_110m_admin_0_countries.geojson').then(r => r.json()),
      fetch('https://raw.githubusercontent.com/southkorea/southkorea-maps/master/kostat/2018/json/skorea-provinces-2018-geo.json').then(r => r.json()),
      fetch('https://raw.githubusercontent.com/southkorea/southkorea-maps/master/kostat/2018/json/skorea-municipalities-2018-geo.json').then(r => r.json())
    ]).then(([routesData, worldGeo, sidoGeo, sigunguGeo]) => {
      rawGeojsonData = routesData;

      rawGeojsonData.features.forEach((f, idx) => {
        f._tempIndex = idx;
        f._timestamp = extractTimestamp(f);
      });

      rawGeojsonData.features.sort((a, b) => a._timestamp - b._timestamp);
      rawGeojsonData.features.forEach((f, index) => {
        f.id = index;
        f._globalId = index + 1;
        const p = f.properties || {};
        const c = p.country || "대한민국";
        const sidos = (p.sido || "").split(',').map(s => s.trim()).filter(Boolean);
        const sigs = (p.sigungu || "").split(',').map(s => s.trim()).filter(Boolean);

        const yr = extractYear(f);
        if (yr) availableYears.add(yr);

        if (!adminHierarchy[c]) adminHierarchy[c] = {};
        if (c === "대한민국") {
          sidos.forEach(sd => {
            if (sd !== "-" && sd !== "") {
              if (!adminHierarchy[c][sd]) adminHierarchy[c][sd] = new Set();
              sigs.forEach(sg => {
                if (sg !== "-" && sg !== "") {
                  if (sd === "서울특별시") {
                    if (SEOUL_DISTRICTS.has(sg)) adminHierarchy[c][sd].add(sg);
                  } else {
                    if (!SEOUL_DISTRICTS.has(sg)) adminHierarchy[c][sd].add(sg);
                  }
                }
              });
            }
          });
        }
      });

      const sortedYears = Array.from(availableYears).sort((a, b) => b.localeCompare(a));
      sortedYears.forEach(yr => {
        mapSelectedYears.add(yr);
        listSelectedYears.add(yr);
        document.getElementById('map-year-checkboxes').innerHTML += `
          <label class="year-checkbox-label">
            <input type="checkbox" value="${yr}" checked onchange="onMapYearChange(this)"> ${yr}년
          </label>
        `;
        document.getElementById('list-year-checkboxes').innerHTML += `
          <label class="year-checkbox-label">
            <input type="checkbox" value="${yr}" checked onchange="onListYearChange(this)"> ${yr}년
          </label>
        `;
      });

      map.addSource('routes', { type: 'geojson', data: rawGeojsonData });
      map.addLayer({ id: 'routes-hitbox', type: 'line', source: 'routes', layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': 'transparent', 'line-width': 18 } });
      map.addLayer({ id: 'routes-line', type: 'line', source: 'routes', layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': '#00ffff', 'line-width': 2.6, 'line-opacity': 0.65 } });
      map.addLayer({ id: 'routes-hover-line', type: 'line', source: 'routes', layout: { 'line-join': 'round', 'line-cap': 'round' }, filter: ['==', ['id'], -9999], paint: { 'line-color': '#ffffff', 'line-width': 5.8, 'line-opacity': 0.85 } });
      map.addLayer({ id: 'routes-active-line', type: 'line', source: 'routes', layout: { 'line-join': 'round', 'line-cap': 'round' }, filter: ['==', ['id'], -9999], paint: { 'line-color': '#ffe600', 'line-width': 5.5, 'line-opacity': 1.0 } });

      buildFilterDropdowns('map');
      buildFilterDropdowns('list');

      resetMapToInitial();
    });

    const hoverPopup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 10 });

    map.on('mouseenter', 'routes-hitbox', (e) => {
      map.getCanvas().style.cursor = 'pointer';
      const feature = e.features[0];
      hoveredLineId = feature.id !== undefined ? feature.id : feature.properties.id;
      updateHoverHighlight(hoveredLineId);

      const props = feature.properties || {};
      const title = props.name || props.Name || '도보 코스';
      const locTag = formatLocationTag(props);
      hoverPopup.setLngLat(e.lngLat).setHTML(`<strong>${feature._globalId}. ${title}</strong>${locTag ? '<br><span style="color:#aaa; font-size:11px;">' + locTag + '</span>' : ''}`).addTo(map);
    });

    map.on('mouseleave', 'routes-hitbox', () => {
      map.getCanvas().style.cursor = '';
      hoveredLineId = null;
      updateHoverHighlight(null);
      hoverPopup.remove();
    });

    map.on('click', 'routes-hitbox', (e) => {
      const clickedFeat = e.features[0];
      const props = clickedFeat.properties || {};
      const videoId = extractYouTubeId(props.description || props.Description || '');
      
      if (!videoId) {
        alert("이 코스는 유튜브 영상 연결 준비 중입니다.");
        return;
      }
      playRouteFeature(clickedFeat);
    });
  });

  function playRouteFeature(feature) {
    activeLine = feature;
    activeLineId = activeLine.id !== undefined ? activeLine.id : activeLine.properties.id;
    const props = activeLine.properties || {};
    const videoId = extractYouTubeId(props.description || props.Description || '');

    if (!videoId) {
      alert("이 코스는 유튜브 영상 연결 준비 중입니다.");
      return;
    }

    const title = `${activeLine._globalId}. ${props.name || props.Name || '도보 코스'}`;

    updateHoverHighlight(null);
    updateActiveRouteHighlight(activeLineId);

    document.getElementById('video-title').innerText = title;
    document.getElementById('list-video-title').innerText = title;

    if (currentMode === 'map') {
      document.getElementById('player-panel').style.display = 'flex';
      zoomToActiveLine();
      if (player && typeof player.loadVideoById === 'function') {
        player.loadVideoById(videoId);
      }
    } else {
      if (listPlayer && typeof listPlayer.loadVideoById === 'function') {
        listPlayer.loadVideoById(videoId);
      }
      renderRouteList();
    }
  }

  function closePlayer() {
    document.getElementById('player-panel').style.display = 'none';
    if (isSplitMode) toggleSplitMode();
    if (player && typeof player.stopVideo === 'function') player.stopVideo();
    currentVideoId = null;
    updateActiveRouteHighlight(null);
    updateHoverHighlight(null);
  }

  function onMapYearChange(cb) {
    if (cb.checked) mapSelectedYears.add(cb.value);
    else mapSelectedYears.delete(cb.value);
    applyMapFilter();
  }

  function onListYearChange(cb) {
    if (cb.checked) listSelectedYears.add(cb.value);
    else listSelectedYears.delete(cb.value);
    renderRouteList();
  }

  function buildFilterDropdowns(type) {
    const cSel = document.getElementById(`${type}-country-select`);
    cSel.innerHTML = `<option value="ALL">${formatCountryLabel('ALL')}</option>`;
    const countries = Object.keys(adminHierarchy).sort((a, b) => (a === '대한민국' ? -1 : b === '대한민국' ? 1 : a.localeCompare(b)));
    countries.forEach(country => {
      cSel.innerHTML += `<option value="${country}">${formatCountryLabel(country)}</option>`;
    });

    cSel.addEventListener('change', () => {
      const c = cSel.value;
      const sdSel = document.getElementById(`${type}-sido-select`);
      const sgSel = document.getElementById(`${type}-sigungu-select`);
      sdSel.innerHTML = `<option value="ALL">${formatSidoLabel('ALL')}</option>`;
      sgSel.innerHTML = `<option value="ALL">${formatSigunguLabel('ALL')}</option>`;

      if (c === '대한민국' && adminHierarchy[c]) {
        sdSel.disabled = false;
        SIDO_SORT_ORDER.forEach(sido => {
          if (adminHierarchy[c][sido]) sdSel.innerHTML += `<option value="${sido}">${formatSidoLabel(sido)}</option>`;
        });
        sgSel.disabled = true;
      } else {
        sdSel.disabled = true;
        sgSel.disabled = true;
      }
      if (type === 'map') applyMapFilter(); else renderRouteList();
    });

    document.getElementById(`${type}-sido-select`).addEventListener('change', () => {
      const c = cSel.value;
      const s = document.getElementById(`${type}-sido-select`).value;
      const sgSel = document.getElementById(`${type}-sigungu-select`);
      sgSel.innerHTML = `<option value="ALL">${formatSigunguLabel('ALL')}</option>`;

      if (c === '대한민국' && s !== 'ALL' && adminHierarchy[c] && adminHierarchy[c][s]) {
        sgSel.disabled = false;
        Array.from(adminHierarchy[c][s]).sort().forEach(sig => {
          sgSel.innerHTML += `<option value="${sig}">${formatSigunguLabel(sig)}</option>`;
        });
      } else {
        sgSel.disabled = true;
      }
      if (type === 'map') applyMapFilter(); else renderRouteList();
    });

    document.getElementById(`${type}-sigungu-select`).addEventListener('change', () => {
      if (type === 'map') applyMapFilter(); else renderRouteList();
    });
  }

  function applyMapFilter() {
    if (!rawGeojsonData) return;
    const c = document.getElementById('map-country-select').value;
    const sd = document.getElementById('map-sido-select').value;
    const sgg = document.getElementById('map-sigungu-select').value;

    const filtered = rawGeojsonData.features.filter(f => {
      const p = f.properties || {};
      if (c !== 'ALL' && p.country !== c) return false;
      if (c === '대한민국' && sd !== 'ALL') {
        const sidos = (p.sido || "").split(',').map(s => s.trim());
        if (!sidos.includes(sd)) return false;
      }
      if (c === '대한민국' && sd !== 'ALL' && sgg !== 'ALL') {
        const sigs = (p.sigungu || "").split(',').map(s => s.trim());
        if (!sigs.includes(sgg)) return false;
      }
      const yr = extractYear(f);
      if (yr && !mapSelectedYears.has(yr)) return false;
      return true;
    });

    const matchedIds = filtered.map(f => f.id);
    const filterExpression = (c === 'ALL' && mapSelectedYears.size === availableYears.size) ? null : ['in', ['id'], ['literal', matchedIds]];
    
    map.setFilter('routes-line', filterExpression);
    map.setFilter('routes-hitbox', filterExpression);

    if (map.getLayer('boundary-sigungu-line') && map.getLayer('boundary-sigungu-fill')) {
      if (sd === 'ALL') {
        map.setLayoutProperty('boundary-sido-line', 'visibility', 'visible');
        map.setLayoutProperty('boundary-sigungu-line', 'visibility', 'none');
        map.setLayoutProperty('boundary-sigungu-fill', 'visibility', 'none');
      } else {
        map.setLayoutProperty('boundary-sido-line', 'visibility', 'none');
        map.setLayoutProperty('boundary-sigungu-line', 'visibility', 'visible');
        map.setLayoutProperty('boundary-sigungu-fill', 'visibility', 'visible');

        // [수정] 시도(_sido)와 시군구(name)가 동시에 일치하는 경우에만 경계선 하이라이트 적용 (동명 자치구 버그 해결)
        if (sgg === 'ALL') {
          map.setFilter('boundary-sigungu-line', ['==', ['get', '_sido'], sd]);
          map.setFilter('boundary-sigungu-fill', ['==', ['get', '_sido'], sd]);
        } else {
          map.setFilter('boundary-sigungu-line', ['all', ['==', ['get', '_sido'], sd], ['==', ['get', 'name'], sgg]]);
          map.setFilter('boundary-sigungu-fill', ['all', ['==', ['get', '_sido'], sd], ['==', ['get', 'name'], sgg]]);
        }
      }
    }

    if (filtered.length > 0) {
      try {
        const fc = turf.featureCollection(filtered);
        const bbox = turf.bbox(fc);
        map.fitBounds(bbox, { padding: window.innerWidth <= 640 ? 40 : 80, maxZoom: 15, duration: 800 });
      } catch(e) {}
    }
  }

  function getFilteredListFeatures() {
    if (!rawGeojsonData) return [];
    const c = document.getElementById('list-country-select').value;
    const sd = document.getElementById('list-sido-select').value;
    const sgg = document.getElementById('list-sigungu-select').value;
    const searchVal = document.getElementById('search-input').value.trim().toLowerCase();

    let filtered = rawGeojsonData.features.filter(f => {
      const p = f.properties || {};
      if (c !== 'ALL' && p.country !== c) return false;
      if (c === '대한민국' && sd !== 'ALL') {
        const sidos = (p.sido || "").split(',').map(s => s.trim());
        if (!sidos.includes(sd)) return false;
      }
      if (c === '대한민국' && sd !== 'ALL' && sgg !== 'ALL') {
        const sigs = (p.sigungu || "").split(',').map(s => s.trim());
        if (!sigs.includes(sgg)) return false;
      }
      const yr = extractYear(f);
      if (yr && !listSelectedYears.has(yr)) return false;

      if (searchVal) {
        const title = (p.name || p.Name || '').toLowerCase();
        const globalIdStr = String(f._globalId);
        if (!title.includes(searchVal) && !globalIdStr.includes(searchVal)) {
          return false;
        }
      }

      return true;
    });

    filtered.sort((a, b) => {
      return sortAscending ? (a._timestamp - b._timestamp) : (b._timestamp - a._timestamp);
    });

    return filtered;
  }

  function renderRouteList() {
    const listScrollArea = document.getElementById('list-scroll-area');
    const features = getFilteredListFeatures();

    if (features.length === 0) {
      listScrollArea.innerHTML = `<div style="text-align:center; color:#888; padding:30px;">조건에 일치하는 워킹 코스가 없습니다.</div>`;
      return;
    }

    let html = '';
    features.forEach((f) => {
      const props = f.properties || {};
      const title = props.name || props.Name || '도보 코스';
      const locTag = formatLocationTag(props);
      const isPlaying = (activeLineId === f.id);

      html += `
        <div class="route-item ${isPlaying ? 'active-playing' : ''}" onclick='playRouteFeature(rawGeojsonData.features[${f._tempIndex}])'>
          <div class="route-number">${f._globalId}</div>
          <div class="route-details">
            <div class="route-item-title">${title}</div>
            <div class="route-item-meta">${locTag}</div>
          </div>
        </div>
      `;
    });

    listScrollArea.innerHTML = html;
  }
</script>
</body>
