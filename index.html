<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>ROUTE S - 아카이브 지도</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #191a1a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    #app-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    #map-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }
    #map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0; left: 0;
    }

    /* OSM 기본 타일을 API 키 없는 고대비 다크모드로 반전 */
    .maplibregl-canvas-container {
      background-color: #1a1a1a;
    }

    #filter-container {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 100;
      background: rgba(18, 20, 26, 0.92);
      padding: 10px 14px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.15);
      display: flex;
      gap: 8px;
      align-items: center;
      backdrop-filter: blur(8px);
    }
    .filter-select {
      background: #252836;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }
    .filter-select:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    #player-panel {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 380px;
      max-width: calc(100vw - 30px);
      background: rgba(18, 20, 26, 0.95);
      color: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.8);
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 100;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.12);
    }
    #player-container { width: 100%; height: 215px; background: #000; position: relative; }
    #player-container iframe { width: 100%; height: 100%; border: none; }
    #info-box { padding: 12px 16px; background: rgba(22, 25, 34, 0.98); }
    #video-title { font-size: 15px; font-weight: bold; margin-bottom: 4px; color: #00ffff; line-height: 1.3; }
    #video-guide { font-size: 11px; color: #888; }

    .panel-btn {
      position: absolute; top: 8px; background: rgba(0,0,0,0.6);
      color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px;
      width: 28px; height: 28px; cursor: pointer; font-size: 14px;
      display: flex; align-items: center; justify-content: center; z-index: 101;
      transition: background 0.2s;
    }
    .panel-btn:hover { background: rgba(0,206,209,0.8); color: #000; }
    #close-btn { right: 8px; font-size: 16px; }
    #split-btn { right: 42px; font-size: 13px; }

    /* 상하 분할 모드 */
    body.split-mode #app-container {
      display: flex;
      flex-direction: column;
    }
    body.split-mode #player-panel {
      position: relative;
      top: 0; left: 0; right: 0;
      width: 100%;
      max-width: 100%;
      height: 50vh;
      border-radius: 0;
      border: none;
      border-bottom: 2px solid #00ffff;
      box-shadow: 0 4px 20px rgba(0,0,0,0.9);
      display: flex;
    }
    body.split-mode #player-container {
      flex: 1;
      height: calc(100% - 50px);
    }
    body.split-mode #map-wrapper {
      flex: none;
      height: 50vh;
      width: 100%;
    }

    /* 제비꼬리 화살표 마커 */
    .arrow-marker {
      width: 32px;
      height: 32px;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .arrow-marker svg {
      width: 26px;
      height: 26px;
      filter: drop-shadow(0 0 6px rgba(255, 71, 87, 0.95)) drop-shadow(0 0 2px #000);
      transform-origin: 50% 50%;
    }

    .maplibregl-popup-content {
      background: rgba(15, 17, 21, 0.95);
      color: #fff;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.15);
    }
  </style>
</head>
<body>

<div id="app-container">
  <div id="player-panel">
    <button id="split-btn" class="panel-btn" onclick="toggleSplitMode()" title="화면 상하 분할 / 팝업 토글">◫</button>
    <button id="close-btn" class="panel-btn" onclick="closePlayer()" title="닫기">×</button>
    <div id="player-container"><div id="yt-player"></div></div>
    <div id="info-box">
      <div id="video-title">코스 명칭</div>
      <div id="video-guide">💡 지도 위 경로를 클릭하면 해당 위치 영상으로 즉시 이동합니다.</div>
    </div>
  </div>

  <div id="map-wrapper">
    <div id="filter-container">
      <select id="country-select" class="filter-select">
        <option value="ALL">1단계: 국가 전체</option>
      </select>
      <select id="sido-select" class="filter-select" disabled>
        <option value="ALL">2단계: 시·도 전체</option>
      </select>
      <select id="sigungu-select" class="filter-select" disabled>
        <option value="ALL">3단계: 시·군·구 전체</option>
      </select>
    </div>
    <div id="map"></div>
  </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
  let player = null;
  let activeLine = null;
  let trackingMarker = null;
  let arrowSvg = null;
  let syncTimer = null;
  let rawGeojsonData = null;
  let adminHierarchy = {};
  let isSplitMode = false;
  let currentVideoId = null;
  let pendingSeekRatio = null;

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('yt-player', {
      height: '100%',
      width: '100%',
      playerVars: { 
        'autoplay': 1, 
        'controls': 1, 
        'rel': 0,
        'enablejsapi': 1,
        'origin': window.location.origin 
      },
      events: {
        'onReady': () => { applyPendingSeek(); },
        'onStateChange': onPlayerStateChange
      }
    });
  }

  // 순수 공식 OSM 타일 + 다크 래스터 튜닝 (API 키 불필요, 줌 19까지 무제한)
  const map = new maplibregl.Map({
    container: 'map',
    scrollZoom: true,
    boxZoom: true,
    dragRotate: true,
    dragPan: true,
    maxZoom: 19,
    style: {
      version: 8,
      sources: {
        'osm-tiles': {
          type: 'raster',
          tiles: [
            'https://a.tile.openstreetmap.org/{z}/{x}/{y}.png',
            'https://b.tile.openstreetmap.org/{z}/{x}/{y}.png',
            'https://c.tile.openstreetmap.org/{z}/{x}/{y}.png'
          ],
          tileSize: 256,
          attribution: '&copy; OpenStreetMap contributors'
        }
      },
      layers: [
        { 
          id: 'osm-tiles-layer', 
          type: 'raster', 
          source: 'osm-tiles', 
          minzoom: 0, 
          maxzoom: 19,
          paint: {
            'raster-brightness-max': 0.35,
            'raster-brightness-min': 0.05,
            'raster-contrast': 0.25,
            'raster-saturation': -1.0
          }
        }
      ]
    },
    center: [126.9780, 37.5665],
    zoom: 11
  });

  map.addControl(new maplibregl.NavigationControl(), 'bottom-right');

  const markerEl = document.createElement('div');
  markerEl.className = 'arrow-marker';
  markerEl.innerHTML = `
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M12 2L21 21L12 16.5L3 21L12 2Z" fill="#ff4757" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
    </svg>
  `;
  arrowSvg = markerEl.querySelector('svg');
  trackingMarker = new maplibregl.Marker({ element: markerEl, anchor: 'center' });

  function extractYouTubeId(url) {
    if (!url) return null;
    const regExp = /(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|shorts\/))([\w-]{11})/;
    const match = url.match(regExp);
    return match ? match[1] : null;
  }

  function getSafeLine(feature) {
    try {
      const coords = turf.coordAll(feature);
      if (coords && coords.length >= 2) {
        return turf.lineString(coords, feature.properties);
      }
    } catch(e) {}
    return null;
  }

  function updateMarkerPosition(currentLen, totalLen, safeLine) {
    if (!safeLine || totalLen <= 0) return;
    try {
      let clampedLen = Math.max(0.0001, Math.min(currentLen, totalLen));
      const currentPos = turf.along(safeLine, clampedLen, { units: 'kilometers' });
      
      const delta = Math.min(0.02, (totalLen - clampedLen) / 2);
      let targetLen = Math.min(totalLen, clampedLen + delta);
      const lookAheadPos = turf.along(safeLine, targetLen, { units: 'kilometers' });
      
      let bearing = 0;
      if (clampedLen < totalLen) {
        bearing = turf.bearing(currentPos, lookAheadPos);
      }

      const coord = currentPos.geometry.coordinates;
      if (coord && !isNaN(coord[0]) && !isNaN(coord[1]) && (coord[0] !== 0 || coord[1] !== 0)) {
        trackingMarker.setLngLat(coord);
        arrowSvg.style.transform = `rotate(${bearing}deg)`;
      }
    } catch(e) {}
  }

  function zoomToActiveLine() {
    if (!activeLine) return;
    try {
      const lineBbox = turf.bbox(activeLine);
      if (isSplitMode) {
        map.fitBounds(lineBbox, { padding: 60, maxZoom: 16.5, duration: 600 });
      } else {
        map.fitBounds(lineBbox, { padding: { top: 60, bottom: 60, left: 60, right: 410 }, maxZoom: 16.5, duration: 600 });
      }
    } catch(err) {}
  }

  function toggleSplitMode() {
    isSplitMode = !isSplitMode;
    document.body.classList.toggle('split-mode', isSplitMode);
    document.getElementById('split-btn').innerText = isSplitMode ? '❐' : '◫';

    map.resize();
    setTimeout(() => {
      map.resize();
      map.triggerRepaint();
      zoomToActiveLine();
    }, 250);
  }

  function applyPendingSeek() {
    if (pendingSeekRatio === null || !player) return;
    try {
      const dur = player.getDuration();
      if (dur && dur > 0) {
        player.seekTo(dur * pendingSeekRatio, true);
        pendingSeekRatio = null;
      }
    } catch(e) {}
  }

  map.on('load', () => {
    fetch('./routes.geojson')
      .then(res => res.json())
      .then(data => {
        rawGeojsonData = data;

        rawGeojsonData.features.forEach((f, idx) => {
          f.id = idx;
          const p = f.properties || {};
          const c = p.country || "대한민국";
          const sidos = (p.sido || "").split(',').map(s => s.trim()).filter(Boolean);
          const sigs = (p.sigungu || "").split(',').map(s => s.trim()).filter(Boolean);

          if (!adminHierarchy[c]) adminHierarchy[c] = {};
          if (c === "대한민국") {
            sidos.forEach(sd => {
              if (sd !== "-" && sd !== "") {
                if (!adminHierarchy[c][sd]) adminHierarchy[c][sd] = new Set();
                sigs.forEach(sg => { if (sg !== "-" && sg !== "") adminHierarchy[c][sd].add(sg); });
              }
            });
          }
        });

        map.addSource('routes', {
          type: 'geojson',
          data: rawGeojsonData
        });

        // 어두운 OSM 배경 위에서 형광 민트색 라인이 선명하게 보이도록 두께 및 발광 설정
        map.addLayer({
          id: 'routes-line',
          type: 'line',
          source: 'routes',
          layout: { 'line-join': 'round', 'line-cap': 'round' },
          paint: {
            'line-color': '#00ffff',
            'line-width': 3.2,
            'line-opacity': 0.95
          }
        });

        buildDynamicFilters();
      });

    const hoverPopup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 10 });
    map.on('mouseenter', 'routes-line', (e) => {
      map.getCanvas().style.cursor = 'pointer';
      const props = e.features[0].properties || {};
      const title = props.name || props.Name || '도보 코스';
      let locTag = '';
      if (props.country === '대한민국' && props.sido) {
        locTag = `<br><span style="color:#aaa; font-size:11px;">[${props.sido} ${props.sigungu || ''}]</span>`;
      } else if (props.country) {
        locTag = `<br><span style="color:#aaa; font-size:11px;">[${props.country}]</span>`;
      }
      hoverPopup.setLngLat(e.lngLat).setHTML(`<strong>${title}</strong>${locTag}<br><span style="color:#00ffff;">클릭하여 영상 시청</span>`).addTo(map);
    });

    map.on('mouseleave', 'routes-line', () => {
      map.getCanvas().style.cursor = '';
      hoverPopup.remove();
    });

    map.on('click', 'routes-line', (e) => {
      activeLine = e.features[0];
      const props = activeLine.properties || {};
      const title = props.name || props.Name || '도보 코스';
      const rawDesc = props.description || props.Description || '';

      const videoId = extractYouTubeId(rawDesc);
      if (!videoId) {
        alert("이 코스에 연결된 유튜브 링크를 추출할 수 없습니다.\n내용: " + rawDesc);
        return;
      }

      document.getElementById('player-panel').style.display = 'flex';
      document.getElementById('video-title').innerText = title;

      zoomToActiveLine();

      const safeLine = getSafeLine(activeLine);
      if (!safeLine) return;

      const clickedLngLat = [e.lngLat.lng, e.lngLat.lat];
      const snapped = turf.nearestPointOnLine(safeLine, turf.point(clickedLngLat));
      const exactPos = snapped.geometry.coordinates;

      // 마커를 클릭한 위치로 즉시 정확하게 고정
      trackingMarker.setLngLat(exactPos).addTo(map);

      const totalLen = turf.length(safeLine, { units: 'kilometers' });
      const startPt = turf.point(safeLine.geometry.coordinates[0]);
      const sliced = turf.lineSlice(startPt, snapped, safeLine);
      const curLen = turf.length(sliced, { units: 'kilometers' });

      pendingSeekRatio = totalLen > 0 ? (curLen / totalLen) : 0;

      try {
        const delta = Math.min(0.02, (totalLen - curLen) / 2);
        const lookAhead = turf.along(safeLine, Math.min(totalLen, curLen + delta), { units: 'kilometers' });
        const initBearing = turf.bearing(snapped, lookAhead);
        arrowSvg.style.transform = `rotate(${initBearing}deg)`;
      } catch(err) {}

      if (currentVideoId !== videoId) {
        currentVideoId = videoId;
        if (player && typeof player.loadVideoById === 'function') {
          player.loadVideoById({ videoId: videoId, startSeconds: (player.getDuration() || 0) * pendingSeekRatio });
        } else {
          document.getElementById('player-container').innerHTML = 
            `<iframe id="yt-player" src="https://www.youtube.com/embed/${videoId}?autoplay=1&enablejsapi=1&origin=${encodeURIComponent(window.location.origin)}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
        }
      } else {
        applyPendingSeek();
      }
    });
  });

  function onPlayerStateChange(event) {
    clearInterval(syncTimer);

    if (event.data === YT.PlayerState.PLAYING || event.data === YT.PlayerState.BUFFERING) {
      applyPendingSeek();
    }

    if (event.data === YT.PlayerState.PLAYING && activeLine) {
      syncTimer = setInterval(() => {
        if (!player || typeof player.getCurrentTime !== 'function') return;
        const curTime = player.getCurrentTime();
        const dur = player.getDuration();
        if (!dur || dur === 0) return;

        const safeLine = getSafeLine(activeLine);
        if (!safeLine) return;
        const totalLen = turf.length(safeLine, { units: 'kilometers' });
        const targetLen = totalLen * (curTime / dur);

        updateMarkerPosition(targetLen, totalLen, safeLine);
      }, 300);
    }
  }

  function closePlayer() {
    document.getElementById('player-panel').style.display = 'none';
    if (isSplitMode) toggleSplitMode();
    if (player && typeof player.stopVideo === 'function') player.stopVideo();
    clearInterval(syncTimer);
    trackingMarker.remove();
    pendingSeekRatio = null;
    currentVideoId = null;
  }

  const countrySelect = document.getElementById('country-select');
  const sidoSelect = document.getElementById('sido-select');
  const sigunguSelect = document.getElementById('sigungu-select');

  function buildDynamicFilters() {
    countrySelect.innerHTML = '<option value="ALL">1단계: 국가 전체</option>';

    const countries = Object.keys(adminHierarchy).sort((a, b) => {
      if (a === '대한민국') return -1;
      if (b === '대한민국') return 1;
      return a.localeCompare(b);
    });

    countries.forEach(country => {
      countrySelect.innerHTML += `<option value="${country}">${country}</option>`;
    });

    countrySelect.addEventListener('change', () => {
      const c = countrySelect.value;
      sidoSelect.innerHTML = '<option value="ALL">2단계: 시·도 전체</option>';
      sigunguSelect.innerHTML = '<option value="ALL">3단계: 시·군·구 전체</option>';

      if (c === '대한민국' && adminHierarchy[c]) {
        sidoSelect.disabled = false;
        Object.keys(adminHierarchy[c]).sort().forEach(sido => {
          sidoSelect.innerHTML += `<option value="${sido}">${sido}</option>`;
        });
        sigunguSelect.disabled = true;
      } else {
        sidoSelect.disabled = true;
        sigunguSelect.disabled = true;
      }
      applyFilter();
    });

    sidoSelect.addEventListener('change', () => {
      const c = countrySelect.value;
      const s = sidoSelect.value;
      sigunguSelect.innerHTML = '<option value="ALL">3단계: 시·군·구 전체</option>';

      if (c === '대한민국' && s !== 'ALL' && adminHierarchy[c] && adminHierarchy[c][s]) {
        sigunguSelect.disabled = false;
        Array.from(adminHierarchy[c][s]).sort().forEach(sig => {
          sigunguSelect.innerHTML += `<option value="${sig}">${sig}</option>`;
        });
      } else {
        sigunguSelect.disabled = true;
      }
      applyFilter();
    });

    sigunguSelect.addEventListener('change', applyFilter);
  }

  function applyFilter() {
    const c = countrySelect.value;
    const sd = sidoSelect.value;
    const sgg = sigunguSelect.value;

    const filteredFeatures = rawGeojsonData.features.filter(f => {
      const p = f.properties || {};
      if (c !== 'ALL' && p.country !== c) return false;
      if (c === '대한민국' && sd !== 'ALL') {
        const sidos = (p.sido || "").split(',').map(s => s.trim());
        if (!sidos.includes(sd)) return false;
      }
      if (c === '대한민국' && sd !== 'ALL' && sgg !== 'ALL') {
        const sigs = (p.sigungu || "").split(',').map(s => s.trim());
        if (!sigs.includes(sgg)) return false;
      }
      return true;
    });

    const matchedIds = filteredFeatures.map(f => f.id);
    if (c === 'ALL') {
      map.setFilter('routes-line', null);
    } else {
      map.setFilter('routes-line', ['in', ['id'], ['literal', matchedIds]]);
    }

    if (filteredFeatures.length > 0) {
      try {
        const fc = turf.featureCollection(filteredFeatures);
        const bbox = turf.bbox(fc);
        map.fitBounds(bbox, { padding: 80, maxZoom: 15, duration: 800 });
      } catch(e) {}
    }
  }
</script>
</body>
</html>
