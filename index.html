<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>ROUTE S - 아카이브 지도</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

  <style>
    body { margin: 0; padding: 0; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }

    #filter-container {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 100;
      background: rgba(18, 20, 26, 0.92);
      padding: 10px 14px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.15);
      display: flex;
      gap: 8px;
      align-items: center;
      backdrop-filter: blur(8px);
    }
    .filter-select {
      background: #252836;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }
    .filter-select:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    #loading-badge {
      font-size: 11px;
      color: #00ffff;
      margin-left: 4px;
      display: inline-block;
    }

    #player-panel {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 380px;
      max-width: calc(100vw - 30px);
      background: rgba(18, 20, 26, 0.95);
      color: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.8);
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 100;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.12);
    }
    #player-container { width: 100%; height: 215px; background: #000; }
    #info-box { padding: 14px 16px; }
    #video-title { font-size: 15px; font-weight: bold; margin-bottom: 6px; color: #00ffff; line-height: 1.3; }
    #video-guide { font-size: 11px; color: #888; }
    #close-btn {
      position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6);
      color: #fff; border: none; border-radius: 50%; width: 28px; height: 28px;
      cursor: pointer; font-size: 16px; line-height: 28px; text-align: center; z-index: 101;
    }

    .maplibregl-popup-content {
      background: rgba(15, 17, 21, 0.95);
      color: #fff;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.15);
    }
  </style>
</head>
<body>

<div id="filter-container">
  <select id="country-select" class="filter-select">
    <option value="ALL">1단계: 국가 전체</option>
  </select>
  <select id="sido-select" class="filter-select" disabled>
    <option value="ALL">2단계: 시·도 전체</option>
  </select>
  <select id="sigungu-select" class="filter-select" disabled>
    <option value="ALL">3단계: 시·군·구 전체</option>
  </select>
  <span id="loading-badge">동기화 중...</span>
</div>

<div id="map"></div>

<div id="player-panel">
  <button id="close-btn" onclick="closePlayer()">×</button>
  <div id="player-container"><div id="yt-player"></div></div>
  <div id="info-box">
    <div id="video-title">코스 명칭</div>
    <div id="video-guide">💡 지도 위 경로를 클릭하면 해당 위치 영상으로 즉시 이동합니다.</div>
  </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
  let player = null;
  let activeLine = null;
  let trackingMarker = null;
  let syncTimer = null;
  let rawGeojsonData = null;
  let adminHierarchy = {}; // { 국가명: { 시도명: Set(시군구명) } }

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('yt-player', {
      height: '100%',
      width: '100%',
      playerVars: { 'autoplay': 1, 'controls': 1, 'rel': 0 },
      events: { 'onStateChange': onPlayerStateChange }
    });
  }

  const map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      sources: {
        'esri-dark-base': {
          type: 'raster',
          tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}'],
          tileSize: 256
        },
        'esri-dark-reference': {
          type: 'raster',
          tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}'],
          tileSize: 256
        }
      },
      layers: [
        { id: 'dark-base', type: 'raster', source: 'esri-dark-base', minzoom: 0, maxzoom: 16 },
        { id: 'dark-ref', type: 'raster', source: 'esri-dark-reference', minzoom: 0, maxzoom: 16 }
      ]
    },
    center: [126.9780, 37.5665],
    zoom: 11
  });

  const markerEl = document.createElement('div');
  markerEl.style.width = '14px';
  markerEl.style.height = '14px';
  markerEl.style.borderRadius = '50%';
  markerEl.style.backgroundColor = '#ff4757';
  markerEl.style.border = '2px solid #ffffff';
  markerEl.style.boxShadow = '0 0 10px #ff4757';
  trackingMarker = new maplibregl.Marker({ element: markerEl });

  const KOREA_SIG_URL = 'https://raw.githubusercontent.com/southkorea/southkorea-maps/master/kostat/2018/json/skorea-municipalities-2018-geo.json';
  const WORLD_COUNTRIES_URL = 'https://d2ad6b4ur7yvpq.cloudfront.net/naturalearth-3.3.0/ne_110m_admin_0_countries.geojson';

  const KOR_SIDO_CODE_MAP = {
    "11": "서울특별시", "21": "부산광역시", "22": "대구광역시", "23": "인천광역시",
    "24": "광주광역시", "25": "대전광역시", "26": "울산광역시", "29": "세종특별자치시",
    "31": "경기도", "32": "강원특별자치도", "33": "충청북도", "34": "충청남도",
    "35": "전북특별자치도", "36": "전라남도", "37": "경상북도", "38": "경상남도", "39": "제주특별자치도"
  };

  // 포괄적 국가명 한글 매핑 사전
  const COUNTRY_NAME_KO = {
    "South Korea": "대한민국", "Korea": "대한민국", "Republic of Korea": "대한민국", "KOR": "대한민국",
    "Japan": "일본", "JPN": "일본",
    "Taiwan": "대만", "TWN": "대만",
    "United States": "미국", "United States of America": "미국", "USA": "미국",
    "Vietnam": "베트남", "Viet Nam": "베트남", "VNM": "베트남",
    "China": "중국", "CHN": "중국",
    "Thailand": "태국", "THA": "태국",
    "Singapore": "싱가포르", "SGP": "싱가포르",
    "Hong Kong": "홍콩", "HKG": "홍콩", "Macao": "마카오",
    "United Kingdom": "영국", "GBR": "영국",
    "France": "프랑스", "FRA": "프랑스",
    "Germany": "독일", "DEU": "독일",
    "Italy": "이탈리아", "ITA": "이탈리아",
    "Spain": "스페인", "ESP": "스페인",
    "Canada": "캐나다", "CAN": "캐나다",
    "Australia": "호주", "AUS": "호주",
    "Philippines": "필리핀", "PHL": "필리핀",
    "Malaysia": "말레이시아", "MYS": "말레이시아",
    "Indonesia": "인도네시아", "IDN": "인도네시아"
  };

  map.on('load', () => {
    Promise.all([
      fetch('./routes.geojson').then(r => r.json()),
      fetch(KOREA_SIG_URL).then(r => r.json()).catch(() => null),
      fetch(WORLD_COUNTRIES_URL).then(r => r.json()).catch(() => null)
    ]).then(([routesData, korSigData, worldData]) => {
      rawGeojsonData = routesData;

      rawGeojsonData.features.forEach((f, idx) => {
        f.id = idx;
        const coords = turf.coordAll(f);
        if (!coords || coords.length === 0) return;

        const firstPt = coords[0];
        const lng = firstPt[0];
        const lat = firstPt[1];

        let countryName = "기타해외";
        const sidoSet = new Set();
        const sigunguSet = new Set();

        // 1. 국가 판별 (오키나와 및 일본 전역 바운딩 박스 보정 포함)
        const isKR = (lng >= 124.0 && lng <= 132.0 && lat >= 33.0 && lat <= 38.9);
        const isJapan = (lng >= 122.5 && lng <= 154.0 && lat >= 24.0 && lat <= 46.0 && !isKR);

        if (isKR) {
          countryName = "대한민국";
        } else if (isJapan) {
          countryName = "일본"; // 오키나와 및 소도서 폴리곤 누락 완벽 해결
        } else if (worldData) {
          const pt = turf.point(firstPt);
          for (let countryPoly of worldData.features) {
            if (turf.booleanPointInPolygon(pt, countryPoly)) {
              const eng = countryPoly.properties.name || countryPoly.properties.ADMIN || countryPoly.properties.SOV_A3 || "";
              countryName = COUNTRY_NAME_KO[eng] || eng;
              break;
            }
          }
        }

        // 2. 대한민국 시도/시군구 다중 교차 판별 (선분 전체 순회 + 해안선 스냅)
        if (countryName === "대한민국" && korSigData) {
          // 성능을 위해 선분의 점들을 적절히 샘플링 (최대 25개 포인트 균등 추출)
          const step = Math.max(1, Math.floor(coords.length / 25));
          for (let i = 0; i < coords.length; i += step) {
            const pt = turf.point(coords[i]);
            let found = false;

            for (let poly of korSigData.features) {
              if (turf.booleanPointInPolygon(pt, poly)) {
                const sgg = poly.properties.name;
                const code = String(poly.properties.code || "");
                const sido = KOR_SIDO_CODE_MAP[code.substring(0, 2)];
                if (sido && sgg) {
                  sidoSet.add(sido);
                  sigunguSet.add(sgg);
                  found = true;
                }
              }
            }

            // 항만, 부두, 방파제 등 바다 쪽으로 삐져나온 경우 (가장 가까운 육지 폴리곤 3km 스냅)
            if (!found && sidoSet.size === 0) {
              let minDist = Infinity;
              let nearestPoly = null;
              for (let poly of korSigData.features) {
                const d = turf.distance(pt, turf.centroid(poly));
                if (d < minDist) {
                  minDist = d;
                  nearestPoly = poly;
                }
              }
              if (nearestPoly && minDist < 60) { // 제주항, 영종도 해안선 등 완벽 구제
                const sgg = nearestPoly.properties.name;
                const code = String(nearestPoly.properties.code || "");
                const sido = KOR_SIDO_CODE_MAP[code.substring(0, 2)];
                if (sido && sgg) {
                  sidoSet.add(sido);
                  sigunguSet.add(sgg);
                }
              }
            }
          }
        }

        // 다중 속성을 배열 및 JSON 문자열로 저장
        f.properties.country = countryName;
        f.properties.sidoList = Array.from(sidoSet);
        f.properties.sigunguList = Array.from(sigunguSet);
        f.properties.sido_str = f.properties.sidoList.join(',');
        f.properties.sigungu_str = f.properties.sigunguList.join(',');

        // 3. 계층 트리 구축 (2개 지역 걸치는 경우 둘 다 트리에 등록)
        if (!adminHierarchy[countryName]) adminHierarchy[countryName] = {};
        if (countryName === "대한민국") {
          f.properties.sidoList.forEach(sido => {
            if (!adminHierarchy[countryName][sido]) adminHierarchy[countryName][sido] = new Set();
            f.properties.sigunguList.forEach(sig => adminHierarchy[countryName][sido].add(sig));
          });
        }
      });

      map.addSource('routes', {
        type: 'geojson',
        data: rawGeojsonData
      });

      map.addLayer({
        id: 'routes-line',
        type: 'line',
        source: 'routes',
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: {
          'line-color': '#00ffff',
          'line-width': 2.8,
          'line-opacity': 0.85
        }
      });

      buildDynamicFilters();
      document.getElementById('loading-badge').style.display = 'none';
    });

    // 툴팁 (다중 지역인 경우 쉼표로 표기)
    const hoverPopup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 10 });
    map.on('mouseenter', 'routes-line', (e) => {
      map.getCanvas().style.cursor = 'pointer';
      const props = e.features[0].properties;
      const title = props.name || props.Name || '도보 코스';
      let locTag = '';
      if (props.country === '대한민국') {
        const s = props.sido_str || '';
        const g = props.sigungu_str || '';
        locTag = `<br><span style="color:#aaa; font-size:11px;">[${s} ${g}]</span>`;
      } else {
        locTag = `<br><span style="color:#aaa; font-size:11px;">[${props.country}]</span>`;
      }
      hoverPopup.setLngLat(e.lngLat).setHTML(`<strong>${title}</strong>${locTag}<br><span style="color:#00ffff;">클릭하여 영상 시청</span>`).addTo(map);
    });

    map.on('mouseleave', 'routes-line', () => {
      map.getCanvas().style.cursor = '';
      hoverPopup.remove();
    });

    // 유튜브 동기화 클릭 이벤트
    map.on('click', 'routes-line', (e) => {
      activeLine = e.features[0];
      const props = activeLine.properties;
      const title = props.name || props.Name || '도보 코스';
      const rawDesc = props.description || props.Description || '';

      const match = rawDesc.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{11})/);
      const videoId = match ? match[1] : null;

      if (!videoId) {
        alert("이 코스에 연결된 유튜브 링크를 찾을 수 없습니다.");
        return;
      }

      document.getElementById('player-panel').style.display = 'flex';
      document.getElementById('video-title').innerText = title;

      if (player && typeof player.loadVideoById === 'function') {
        player.loadVideoById(videoId);
      }

      const clickedCoords = [e.lngLat.lng, e.lngLat.lat];
      const snapped = turf.nearestPointOnLine(activeLine, turf.point(clickedCoords));
      const totalLen = turf.length(activeLine, { units: 'kilometers' });
      const sliced = turf.lineSlice(turf.point(activeLine.geometry.coordinates[0]), snapped, activeLine);
      const curLen = turf.length(sliced, { units: 'kilometers' });

      setTimeout(() => {
        const dur = player.getDuration() || 0;
        if (dur > 0 && totalLen > 0) {
          player.seekTo((curLen / totalLen) * dur, true);
        }
      }, 700);

      trackingMarker.setLngLat(snapped.geometry.coordinates).addTo(map);
    });
  });

  const countrySelect = document.getElementById('country-select');
  const sidoSelect = document.getElementById('sido-select');
  const sigunguSelect = document.getElementById('sigungu-select');

  function buildDynamicFilters() {
    countrySelect.innerHTML = '<option value="ALL">1단계: 국가 전체</option>';

    const countries = Object.keys(adminHierarchy).sort((a, b) => {
      if (a === '대한민국') return -1;
      if (b === '대한민국') return 1;
      return a.localeCompare(b);
    });

    countries.forEach(country => {
      countrySelect.innerHTML += `<option value="${country}">${country}</option>`;
    });

    countrySelect.addEventListener('change', () => {
      const c = countrySelect.value;
      sidoSelect.innerHTML = '<option value="ALL">2단계: 시·도 전체</option>';
      sigunguSelect.innerHTML = '<option value="ALL">3단계: 시·군·구 전체</option>';

      if (c === '대한민국') {
        sidoSelect.disabled = false;
        Object.keys(adminHierarchy[c]).sort().forEach(sido => {
          sidoSelect.innerHTML += `<option value="${sido}">${sido}</option>`;
        });
        sigunguSelect.disabled = true;
      } else {
        sidoSelect.disabled = true;
        sigunguSelect.disabled = true;
      }
      applyFilter();
    });

    sidoSelect.addEventListener('change', () => {
      const c = countrySelect.value;
      const s = sidoSelect.value;
      sigunguSelect.innerHTML = '<option value="ALL">3단계: 시·군·구 전체</option>';

      if (c === '대한민국' && s !== 'ALL' && adminHierarchy[c] && adminHierarchy[c][s]) {
        sigunguSelect.disabled = false;
        Array.from(adminHierarchy[c][s]).sort().forEach(sig => {
          sigunguSelect.innerHTML += `<option value="${sig}">${sig}</option>`;
        });
      } else {
        sigunguSelect.disabled = true;
      }
      applyFilter();
    });

    sigunguSelect.addEventListener('change', applyFilter);
  }

  // 다중 지역 포함(in/has) 필터링 함수
  function applyFilter() {
    const c = countrySelect.value;
    const sd = sidoSelect.value;
    const sgg = sigunguSelect.value;

    const filteredFeatures = rawGeojsonData.features.filter(f => {
      const p = f.properties;
      if (c !== 'ALL' && p.country !== c) return false;
      if (c === '대한민국' && sd !== 'ALL') {
        if (!p.sidoList || !p.sidoList.includes(sd)) return false;
      }
      if (c === '대한민국' && sd !== 'ALL' && sgg !== 'ALL') {
        if (!p.sigunguList || !p.sigunguList.includes(sgg)) return false;
      }
      return true;
    });

    // MapLibre 레이어 필터 업데이트 (ID 기반 매칭)
    const matchedIds = filteredFeatures.map(f => f.id);
    if (c === 'ALL') {
      map.setFilter('routes-line', null);
    } else {
      map.setFilter('routes-line', ['in', ['id'], ['literal', matchedIds]]);
    }

    // 영역 바운딩 박스 줌 이동
    if (filteredFeatures.length > 0) {
      const fc = turf.featureCollection(filteredFeatures);
      const bbox = turf.bbox(fc);
      map.fitBounds(bbox, { padding: 80, maxZoom: 14, duration: 1200 });
    }
  }

  function onPlayerStateChange(event) {
    clearInterval(syncTimer);
    if (event.data === YT.PlayerState.PLAYING && activeLine) {
      syncTimer = setInterval(() => {
        const curTime = player.getCurrentTime();
        const dur = player.getDuration();
        if (!dur || dur === 0) return;

        const totalLen = turf.length(activeLine, { units: 'kilometers' });
        const targetLen = totalLen * (curTime / dur);

        const currentPos = turf.along(activeLine, targetLen, { units: 'kilometers' });
        trackingMarker.setLngLat(currentPos.geometry.coordinates);
      }, 500);
    }
  }

  function closePlayer() {
    document.getElementById('player-panel').style.display = 'none';
    if (player && typeof player.stopVideo === 'function') player.stopVideo();
    clearInterval(syncTimer);
    trackingMarker.remove();
  }
</script>
</body>
</html>
