<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>ROUTE S - 아카이브 지도</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #191a1a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    #app-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    #map-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }
    #map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0; left: 0;
    }

    .maplibregl-canvas-container {
      background-color: #1a1a1a;
    }

    /* 3단 드롭다운 필터 컨테이너 */
    #filter-container {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 100;
      background: rgba(18, 20, 26, 0.92);
      padding: 8px 12px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.15);
      display: flex;
      gap: 6px;
      align-items: center;
      backdrop-filter: blur(8px);
      max-width: calc(100vw - 30px);
    }

    .filter-select {
      background: #252836;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12.5px;
      outline: none;
      cursor: pointer;
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
    }
    .filter-select:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* 스마트폰 반응형 */
    @media (max-width: 640px) {
      #filter-container {
        top: 10px;
        left: 10px;
        right: 10px;
        width: calc(100% - 20px);
        padding: 6px 8px;
        gap: 4px;
      }
      .filter-select {
        flex: 1;
        min-width: 0;
        padding: 5px 4px;
        font-size: 11px;
      }
    }

    #player-panel {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 380px;
      max-width: calc(100vw - 30px);
      background: rgba(18, 20, 26, 0.95);
      color: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.8);
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 100;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.12);
    }
    #player-container { width: 100%; height: 215px; background: #000; position: relative; }
    #player-container iframe { width: 100%; height: 100%; border: none; }
    #info-box { padding: 12px 16px; background: rgba(22, 25, 34, 0.98); }
    #video-title { font-size: 14.5px; font-weight: bold; margin-bottom: 4px; color: #00ffff; line-height: 1.3; }
    #video-guide { font-size: 11px; color: #888; }

    .panel-btn {
      position: absolute; top: 8px; background: rgba(0,0,0,0.6);
      color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px;
      width: 28px; height: 28px; cursor: pointer; font-size: 14px;
      display: flex; align-items: center; justify-content: center; z-index: 101;
      transition: background 0.2s;
    }
    .panel-btn:hover { background: rgba(0,206,209,0.8); color: #000; }
    #close-btn { right: 8px; font-size: 16px; }
    #split-btn { right: 42px; font-size: 13px; }

    /* 상하 분할 모드 */
    body.split-mode #app-container {
      display: flex;
      flex-direction: column;
    }
    body.split-mode #player-panel {
      position: relative;
      top: 0; left: 0; right: 0;
      width: 100%;
      max-width: 100%;
      height: 50vh;
      border-radius: 0;
      border: none;
      border-bottom: 2px solid #00ffff;
      box-shadow: 0 4px 20px rgba(0,0,0,0.9);
      display: flex;
    }
    body.split-mode #player-container {
      flex: 1;
      height: calc(100% - 50px);
    }
    body.split-mode #map-wrapper {
      flex: none;
      height: 50vh;
      width: 100%;
    }

    /* 제비꼬리 화살표 마커 */
    .arrow-marker {
      width: 32px;
      height: 32px;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .arrow-marker svg {
      width: 26px;
      height: 26px;
      filter: drop-shadow(0 0 6px rgba(255, 71, 87, 0.95)) drop-shadow(0 0 2px #000);
      transform-origin: 50% 50%;
    }

    .maplibregl-popup-content {
      background: rgba(15, 17, 21, 0.95);
      color: #fff;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.15);
    }
  </style>
</head>
<body>

<div id="app-container">
  <div id="player-panel">
    <button id="split-btn" class="panel-btn" onclick="toggleSplitMode()" title="화면 상하 분할 / 팝업 토글">◫</button>
    <button id="close-btn" class="panel-btn" onclick="closePlayer()" title="닫기">×</button>
    <div id="player-container"><div id="yt-player"></div></div>
    <div id="info-box">
      <div id="video-title">코스 명칭</div>
      <div id="video-guide">💡 지도 위 경로를 클릭하면 해당 위치 영상으로 즉시 이동합니다.</div>
    </div>
  </div>

  <div id="map-wrapper">
    <div id="filter-container">
      <select id="country-select" class="filter-select">
        <option value="ALL">1: 국가 전체 (All)</option>
      </select>
      <select id="sido-select" class="filter-select" disabled>
        <option value="ALL">2: 시·도 (State)</option>
      </select>
      <select id="sigungu-select" class="filter-select" disabled>
        <option value="ALL">3: 시·군·구 (City/Dist.)</option>
      </select>
    </div>
    <div id="map"></div>
  </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
  let player = null;
  let activeLine = null;
  let trackingMarker = null;
  let arrowSvg = null;
  let syncTimer = null;
  let rawGeojsonData = null;
  let adminHierarchy = {};
  let isSplitMode = false;
  let currentVideoId = null;
  let pendingSeekRatio = null;

  /* ================= 한영 표기 매핑 사전 ================= */
  const COUNTRY_EN_MAP = {
    "대한민국": "Korea", "일본": "Japan", "싱가포르": "Singapore",
    "남아프리카공화국": "RSA", "대만": "Taiwan", "미국": "USA"
  };

  const SIDO_EN_MAP = {
    "서울특별시": "Seoul", "부산광역시": "Busan", "대구광역시": "Daegu", "인천광역시": "Incheon",
    "광주광역시": "Gwangju", "대전광역시": "Daejeon", "울산광역시": "Ulsan", "세종특별자치시": "Sejong",
    "경기도": "Gyeonggi", "강원특별자치도": "Gangwon", "충청북도": "Chungbuk", "충청남도": "Chungnam",
    "전북특별자치도": "Jeonbuk", "전라남도": "Jeonnam", "경상북도": "Gyeongbuk", "경상남도": "Gyeongnam",
    "제주특별자치도": "Jeju"
  };

  const KOR_SIDO_CODE_MAP = {
    "11": "서울특별시", "21": "부산광역시", "22": "대구광역시", "23": "인천광역시",
    "24": "광주광역시", "25": "대전광역시", "26": "울산광역시", "29": "세종특별자치시",
    "31": "경기도", "32": "강원특별자치도", "33": "충청북도", "34": "충청남도",
    "35": "전북특별자치도", "36": "전라남도", "37": "경상북도", "38": "경상남도", "39": "제주특별자치도"
  };

  const DISTRICT_EN_MAP = {
    "종로구": "Jongno-gu", "중구": "Jung-gu", "용산구": "Yongsan-gu", "성동구": "Seongdong-gu",
    "광진구": "Gwangjin-gu", "동대문구": "Dongdaemun-gu", "중랑구": "Jungnang-gu", "성북구": "Seongbuk-gu",
    "강북구": "Gangbuk-gu", "도봉구": "Dobong-gu", "노원구": "Nowon-gu", "은평구": "Eunpyeong-gu",
    "서대문구": "Seodaemun-gu", "마포구": "Mapo-gu", "양천구": "Yangcheon-gu", "강서구": "Gangseo-gu",
    "구로구": "Guro-gu", "금천구": "Geumcheon-gu", "영등포구": "Yeongdeungpo-gu", "동작구": "Dongjak-gu",
    "관악구": "Gwanak-gu", "서초구": "Seocho-gu", "강남구": "Gangnam-gu", "송파구": "Songpa-gu",
    "강동구": "Gangdong-gu", "고양시덕양구": "Goyang Deogyang", "고양시일산동구": "Ilsandong-gu",
    "고양시일산서구": "Ilsanseo-gu", "성남시분당구": "Bundang-gu", "수원시팔달구": "Paldal-gu",
    "제주시": "Jeju-si", "서귀포시": "Seogwipo-si"
  };

  function formatCountryLabel(val) {
    if (val === "ALL") return "1: 국가 전체 (All)";
    const en = COUNTRY_EN_MAP[val] || val;
    return `${val} (${en})`;
  }

  function formatSidoLabel(val) {
    if (val === "ALL") return "2: 시·도 (State)";
    const en = SIDO_EN_MAP[val] || val;
    return `${val} (${en})`;
  }

  function formatSigunguLabel(val) {
    if (val === "ALL") return "3: 시·군·구 (City/Dist.)";
    let en = DISTRICT_EN_MAP[val];
    if (!en) {
      if (val.endsWith('구')) en = val.replace('구', '-gu');
      else if (val.endsWith('시')) en = val.replace('시', '-si');
      else if (val.endsWith('군')) en = val.replace('군', '-gun');
      else en = val;
    }
    return `${val} (${en})`;
  }

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('yt-player', {
      height: '100%',
      width: '100%',
      playerVars: { 
        'autoplay': 1, 
        'controls': 1, 
        'rel': 0,
        'enablejsapi': 1,
        'origin': window.location.origin 
      },
      events: {
        'onReady': () => { applyPendingSeek(); },
        'onStateChange': onPlayerStateChange
      }
    });
  }

  const map = new maplibregl.Map({
    container: 'map',
    scrollZoom: true,
    boxZoom: true,
    dragRotate: true,
    dragPan: true,
    maxZoom: 19,
    style: {
      version: 8,
      sources: {
        'osm-tiles': {
          type: 'raster',
          tiles: [
            'https://a.tile.openstreetmap.org/{z}/{x}/{y}.png',
            'https://b.tile.openstreetmap.org/{z}/{x}/{y}.png',
            'https://c.tile.openstreetmap.org/{z}/{x}/{y}.png'
          ],
          tileSize: 256,
          attribution: '&copy; OpenStreetMap contributors'
        }
      },
      layers: [
        { 
          id: 'osm-tiles-layer', 
          type: 'raster', 
          source: 'osm-tiles', 
          minzoom: 0, 
          maxzoom: 19,
          paint: {
            'raster-brightness-max': 0.35,
            'raster-brightness-min': 0.05,
            'raster-contrast': 0.25,
            'raster-saturation': -1.0
          }
        }
      ]
    },
    center: [126.9780, 37.5665],
    zoom: 11
  });

  map.addControl(new maplibregl.NavigationControl(), 'bottom-right');

  const markerEl = document.createElement('div');
  markerEl.className = 'arrow-marker';
  markerEl.innerHTML = `
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M12 2L21 21L12 16.5L3 21L12 2Z" fill="#ff4757" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
    </svg>
  `;
  arrowSvg = markerEl.querySelector('svg');
  trackingMarker = new maplibregl.Marker({ element: markerEl, anchor: 'center' });

  function extractYouTubeId(url) {
    if (!url) return null;
    const regExp = /(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|shorts\/))([\w-]{11})/;
    const match = url.match(regExp);
    return match ? match[1] : null;
  }

  /* ================= 노드 순서 자동 연속 재정렬 엔진 ================= */
  function reorderCoordsContinuous(rawCoords) {
    if (!rawCoords || rawCoords.length <= 2) return rawCoords;

    // 중복 제거 및 유효 노드 목록 생성
    const remaining = [];
    for (let i = 0; i < rawCoords.length; i++) {
      const pt = rawCoords[i];
      if (pt && !isNaN(pt[0]) && !isNaN(pt[1])) {
        if (remaining.length === 0 || remaining[remaining.length - 1][0] !== pt[0] || remaining[remaining.length - 1][1] !== pt[1]) {
          remaining.push(pt);
        }
      }
    }

    if (remaining.length <= 2) return remaining;

    // 시작점(첫 점)을 기준으로 가장 가까운 다음 노드를 탐욕적으로 체인 연결
    const ordered = [remaining.shift()];

    while (remaining.length > 0) {
      const current = ordered[ordered.length - 1];
      let nearestIdx = 0;
      let minDistanceSq = Infinity;

      for (let i = 0; i < remaining.length; i++) {
        const dx = remaining[i][0] - current[0];
        const dy = remaining[i][1] - current[1];
        const distSq = dx * dx + dy * dy;

        if (distSq < minDistanceSq) {
          minDistanceSq = distSq;
          nearestIdx = i;
        }
      }

      ordered.push(remaining.splice(nearestIdx, 1)[0]);
    }

    return ordered;
  }

  // 노드 순서를 단방향으로 재정렬한 안전한 LineString 객체 반환
  function getSafeLine(feature) {
    try {
      const allCoords = turf.coordAll(feature);
      if (allCoords && allCoords.length >= 2) {
        const sortedCoords = reorderCoordsContinuous(allCoords);
        return turf.lineString(sortedCoords, feature.properties);
      }
    } catch(e) {}
    return null;
  }

  function updateMarkerPosition(currentLen, totalLen, safeLine) {
    if (!safeLine || totalLen <= 0) return;
    try {
      let clampedLen = Math.max(0.0001, Math.min(currentLen, totalLen));
      const currentPos = turf.along(safeLine, clampedLen, { units: 'kilometers' });
      
      const delta = Math.min(0.02, (totalLen - clampedLen) / 2);
      let targetLen = Math.min(totalLen, clampedLen + delta);
      const lookAheadPos = turf.along(safeLine, targetLen, { units: 'kilometers' });
      
      let bearing = 0;
      if (clampedLen < totalLen) {
        bearing = turf.bearing(currentPos, lookAheadPos);
      }

      const coord = currentPos.geometry.coordinates;
      if (coord && !isNaN(coord[0]) && !isNaN(coord[1]) && (coord[0] !== 0 || coord[1] !== 0)) {
        trackingMarker.setLngLat(coord);
        arrowSvg.style.transform = `rotate(${bearing}deg)`;
      }
    } catch(e) {}
  }

  function zoomToActiveLine() {
    if (!activeLine) return;
    try {
      const lineBbox = turf.bbox(activeLine);
      const isMobile = window.innerWidth <= 640;
      const pad = isMobile ? 30 : 60;
      const rightPad = (isSplitMode || isMobile) ? pad : 410;

      map.fitBounds(lineBbox, {
        padding: { top: pad, bottom: pad, left: pad, right: rightPad },
        maxZoom: 16.5,
        duration: 600
      });
    } catch(err) {}
  }

  function toggleSplitMode() {
    isSplitMode = !isSplitMode;
    document.body.classList.toggle('split-mode', isSplitMode);
    document.getElementById('split-btn').innerText = isSplitMode ? '❐' : '◫';

    map.resize();
    setTimeout(() => {
      map.resize();
      map.triggerRepaint();
      zoomToActiveLine();
    }, 250);
  }

  function applyPendingSeek() {
    if (pendingSeekRatio === null || !player) return;
    try {
      const dur = player.getDuration();
      if (dur && dur > 0) {
        player.seekTo(dur * pendingSeekRatio, true);
        pendingSeekRatio = null;
      }
    } catch(e) {}
  }

  map.on('load', () => {
    Promise.all([
      fetch('./routes.geojson').then(r => r.json()),
      fetch('https://d2ad6b4ur7yvpq.cloudfront.net/naturalearth-3.3.0/ne_110m_admin_0_countries.geojson').then(r => r.json()),
      fetch('https://raw.githubusercontent.com/southkorea/southkorea-maps/master/kostat/2018/json/skorea-provinces-2018-geo.json').then(r => r.json()),
      fetch('https://raw.githubusercontent.com/southkorea/southkorea-maps/master/kostat/2018/json/skorea-municipalities-2018-geo.json').then(r => r.json())
    ]).then(([routesData, worldGeo, sidoGeo, sigunguGeo]) => {
      rawGeojsonData = routesData;

      // 1. 세계 국경선
      map.addSource('boundary-country-source', { type: 'geojson', data: worldGeo });
      map.addLayer({
        id: 'boundary-country-line',
        type: 'line',
        source: 'boundary-country-source',
        layout: { 'visibility': 'visible' },
        paint: {
          'line-color': '#ffffff',
          'line-width': 1.2,
          'line-opacity': 0.35,
          'line-dasharray': [3, 2]
        }
      });

      // 2. 대한민국 시도 경계선
      map.addSource('boundary-sido-source', { type: 'geojson', data: sidoGeo });
      map.addLayer({
        id: 'boundary-sido-line',
        type: 'line',
        source: 'boundary-sido-source',
        layout: { 'visibility': 'none' },
        paint: {
          'line-color': '#a4b0be',
          'line-width': 1.8,
          'line-opacity': 0.65
        }
      });

      // 3. 대한민국 시군구 경계선
      sigunguGeo.features.forEach(f => {
        const prefix = String(f.properties.code || '').substring(0, 2);
        f.properties._sido = KOR_SIDO_CODE_MAP[prefix] || "기타시도";
      });

      map.addSource('boundary-sigungu-source', { type: 'geojson', data: sigunguGeo });
      map.addLayer({
        id: 'boundary-sigungu-line',
        type: 'line',
        source: 'boundary-sigungu-source',
        layout: { 'visibility': 'none' },
        paint: {
          'line-color': '#dfe4ea',
          'line-width': 1.1,
          'line-opacity': 0.5,
          'line-dasharray': [2, 2]
        }
      });

      map.addLayer({
        id: 'boundary-sigungu-fill',
        type: 'fill',
        source: 'boundary-sigungu-source',
        layout: { 'visibility': 'none' },
        paint: {
          'fill-color': '#00ffff',
          'fill-opacity': 0.04
        }
      });

      // 4. 메인 도보 코스
      rawGeojsonData.features.forEach((f, idx) => {
        f.id = idx;
        const p = f.properties || {};
        const c = p.country || "대한민국";
        const sidos = (p.sido || "").split(',').map(s => s.trim()).filter(Boolean);
        const sigs = (p.sigungu || "").split(',').map(s => s.trim()).filter(Boolean);

        if (!adminHierarchy[c]) adminHierarchy[c] = {};
        if (c === "대한민국") {
          sidos.forEach(sd => {
            if (sd !== "-" && sd !== "") {
              if (!adminHierarchy[c][sd]) adminHierarchy[c][sd] = new Set();
              sigs.forEach(sg => { if (sg !== "-" && sg !== "") adminHierarchy[c][sd].add(sg); });
            }
          });
        }
      });

      map.addSource('routes', {
        type: 'geojson',
        data: rawGeojsonData
      });

      map.addLayer({
        id: 'routes-line',
        type: 'line',
        source: 'routes',
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: {
          'line-color': '#00ffff',
          'line-width': 3.2,
          'line-opacity': 0.95
        }
      });

      buildDynamicFilters();
    });

    const hoverPopup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 10 });
    map.on('mouseenter', 'routes-line', (e) => {
      map.getCanvas().style.cursor = 'pointer';
      const props = e.features[0].properties || {};
      const title = props.name || props.Name || '도보 코스';
      let locTag = '';
      if (props.country === '대한민국' && props.sido) {
        locTag = `<br><span style="color:#aaa; font-size:11px;">[${props.sido} ${props.sigungu || ''}]</span>`;
      } else if (props.country) {
        locTag = `<br><span style="color:#aaa; font-size:11px;">[${props.country}]</span>`;
      }
      hoverPopup.setLngLat(e.lngLat).setHTML(`<strong>${title}</strong>${locTag}<br><span style="color:#00ffff;">클릭하여 영상 시청</span>`).addTo(map);
    });

    map.on('mouseleave', 'routes-line', () => {
      map.getCanvas().style.cursor = '';
      hoverPopup.remove();
    });

    // 코스 클릭 이벤트: 재정렬된 선분을 바탕으로 정확한 거리/시간 매칭
    map.on('click', 'routes-line', (e) => {
      activeLine = e.features[0];
      const props = activeLine.properties || {};
      const title = props.name || props.Name || '도보 코스';
      const rawDesc = props.description || props.Description || '';

      const videoId = extractYouTubeId(rawDesc);
      if (!videoId) {
        alert("이 코스에 연결된 유튜브 링크를 추출할 수 없습니다.\n내용: " + rawDesc);
        return;
      }

      document.getElementById('player-panel').style.display = 'flex';
      document.getElementById('video-title').innerText = title;

      zoomToActiveLine();

      // 점 순서가 바르게 재정렬된 안전 선분 생성
      const safeLine = getSafeLine(activeLine);
      if (!safeLine) return;

      const clickedLngLat = [e.lngLat.lng, e.lngLat.lat];
      const snapped = turf.nearestPointOnLine(safeLine, turf.point(clickedLngLat));
      const exactPos = snapped.geometry.coordinates;

      trackingMarker.setLngLat(exactPos).addTo(map);

      const totalLen = turf.length(safeLine, { units: 'kilometers' });
      const startPt = turf.point(safeLine.geometry.coordinates[0]);
      const sliced = turf.lineSlice(startPt, snapped, safeLine);
      const curLen = turf.length(sliced, { units: 'kilometers' });

      pendingSeekRatio = totalLen > 0 ? (curLen / totalLen) : 0;

      try {
        const delta = Math.min(0.02, (totalLen - curLen) / 2);
        const lookAhead = turf.along(safeLine, Math.min(totalLen, curLen + delta), { units: 'kilometers' });
        const initBearing = turf.bearing(snapped, lookAhead);
        arrowSvg.style.transform = `rotate(${initBearing}deg)`;
      } catch(err) {}

      if (currentVideoId !== videoId) {
        currentVideoId = videoId;
        if (player && typeof player.loadVideoById === 'function') {
          player.loadVideoById({ videoId: videoId, startSeconds: (player.getDuration() || 0) * pendingSeekRatio });
        } else {
          document.getElementById('player-container').innerHTML = 
            `<iframe id="yt-player" src="https://www.youtube.com/embed/${videoId}?autoplay=1&enablejsapi=1&origin=${encodeURIComponent(window.location.origin)}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
        }
      } else {
        applyPendingSeek();
      }
    });
  });

  function onPlayerStateChange(event) {
    clearInterval(syncTimer);

    if (event.data === YT.PlayerState.PLAYING || event.data === YT.PlayerState.BUFFERING) {
      applyPendingSeek();
    }

    if (event.data === YT.PlayerState.PLAYING && activeLine) {
      syncTimer = setInterval(() => {
        if (!player || typeof player.getCurrentTime !== 'function') return;
        const curTime = player.getCurrentTime();
        const dur = player.getDuration();
        if (!dur || dur === 0) return;

        const safeLine = getSafeLine(activeLine);
        if (!safeLine) return;
        const totalLen = turf.length(safeLine, { units: 'kilometers' });
        const targetLen = totalLen * (curTime / dur);

        updateMarkerPosition(targetLen, totalLen, safeLine);
      }, 300);
    }
  }

  function closePlayer() {
    document.getElementById('player-panel').style.display = 'none';
    if (isSplitMode) toggleSplitMode();
    if (player && typeof player.stopVideo === 'function') player.stopVideo();
    clearInterval(syncTimer);
    trackingMarker.remove();
    pendingSeekRatio = null;
    currentVideoId = null;
  }

  const countrySelect = document.getElementById('country-select');
  const sidoSelect = document.getElementById('sido-select');
  const sigunguSelect = document.getElementById('sigungu-select');

  function buildDynamicFilters() {
    countrySelect.innerHTML = `<option value="ALL">${formatCountryLabel('ALL')}</option>`;

    const countries = Object.keys(adminHierarchy).sort((a, b) => {
      if (a === '대한민국') return -1;
      if (b === '대한민국') return 1;
      return a.localeCompare(b);
    });

    countries.forEach(country => {
      countrySelect.innerHTML += `<option value="${country}">${formatCountryLabel(country)}</option>`;
    });

    countrySelect.addEventListener('change', () => {
      const c = countrySelect.value;
      sidoSelect.innerHTML = `<option value="ALL">${formatSidoLabel('ALL')}</option>`;
      sigunguSelect.innerHTML = `<option value="ALL">${formatSigunguLabel('ALL')}</option>`;

      if (c === '대한민국' && adminHierarchy[c]) {
        sidoSelect.disabled = false;
        Object.keys(adminHierarchy[c]).sort().forEach(sido => {
          sidoSelect.innerHTML += `<option value="${sido}">${formatSidoLabel(sido)}</option>`;
        });
        sigunguSelect.disabled = true;
      } else {
        sidoSelect.disabled = true;
        sigunguSelect.disabled = true;
      }
      applyFilter();
    });

    sidoSelect.addEventListener('change', () => {
      const c = countrySelect.value;
      const s = sidoSelect.value;
      sigunguSelect.innerHTML = `<option value="ALL">${formatSigunguLabel('ALL')}</option>`;

      if (c === '대한민국' && s !== 'ALL' && adminHierarchy[c] && adminHierarchy[c][s]) {
        sigunguSelect.disabled = false;
        Array.from(adminHierarchy[c][s]).sort().forEach(sig => {
          sigunguSelect.innerHTML += `<option value="${sig}">${formatSigunguLabel(sig)}</option>`;
        });
      } else {
        sigunguSelect.disabled = true;
      }
      applyFilter();
    });

    sigunguSelect.addEventListener('change', applyFilter);
  }

  function applyFilter() {
    const c = countrySelect.value;
    const sd = sidoSelect.value;
    const sgg = sigunguSelect.value;

    /* 코스 라인 필터링 */
    const filteredFeatures = rawGeojsonData.features.filter(f => {
      const p = f.properties || {};
      if (c !== 'ALL' && p.country !== c) return false;
      if (c === '대한민국' && sd !== 'ALL') {
        const sidos = (p.sido || "").split(',').map(s => s.trim());
        if (!sidos.includes(sd)) return false;
      }
      if (c === '대한민국' && sd !== 'ALL' && sgg !== 'ALL') {
        const sigs = (p.sigungu || "").split(',').map(s => s.trim());
        if (!sigs.includes(sgg)) return false;
      }
      return true;
    });

    const matchedIds = filteredFeatures.map(f => f.id);
    if (c === 'ALL') {
      map.setFilter('routes-line', null);
    } else {
      map.setFilter('routes-line', ['in', ['id'], ['literal', matchedIds]]);
    }

    /* 단계별 행정경계 표출 */
    if (map.getLayer('boundary-country-line')) {
      if (c === 'ALL') {
        map.setLayoutProperty('boundary-country-line', 'visibility', 'visible');
        map.setLayoutProperty('boundary-sido-line', 'visibility', 'none');
        map.setLayoutProperty('boundary-sigungu-line', 'visibility', 'none');
        map.setLayoutProperty('boundary-sigungu-fill', 'visibility', 'none');
      } else if (c === '대한민국') {
        map.setLayoutProperty('boundary-country-line', 'visibility', 'none');

        if (sd === 'ALL') {
          map.setLayoutProperty('boundary-sido-line', 'visibility', 'visible');
          map.setLayoutProperty('boundary-sigungu-line', 'visibility', 'none');
          map.setLayoutProperty('boundary-sigungu-fill', 'visibility', 'none');
        } else {
          map.setLayoutProperty('boundary-sido-line', 'visibility', 'none');
          map.setLayoutProperty('boundary-sigungu-line', 'visibility', 'visible');
          map.setLayoutProperty('boundary-sigungu-fill', 'visibility', 'visible');

          if (sgg === 'ALL') {
            map.setFilter('boundary-sigungu-line', ['==', ['get', '_sido'], sd]);
            map.setFilter('boundary-sigungu-fill', ['==', ['get', '_sido'], sd]);
          } else {
            map.setFilter('boundary-sigungu-line', ['==', ['get', 'name'], sgg]);
            map.setFilter('boundary-sigungu-fill', ['==', ['get', 'name'], sgg]);
          }
        }
      } else {
        map.setLayoutProperty('boundary-country-line', 'visibility', 'visible');
        map.setLayoutProperty('boundary-sido-line', 'visibility', 'none');
        map.setLayoutProperty('boundary-sigungu-line', 'visibility', 'none');
        map.setLayoutProperty('boundary-sigungu-fill', 'visibility', 'none');
      }
    }

    if (filteredFeatures.length > 0) {
      try {
        const fc = turf.featureCollection(filteredFeatures);
        const bbox = turf.bbox(fc);
        const isMobile = window.innerWidth <= 640;
        map.fitBounds(bbox, { padding: isMobile ? 40 : 80, maxZoom: 15, duration: 800 });
      } catch(e) {}
    }
  }
</script>
